<script>
// ---- js/scenes/09_finale.js
// 81–90 s · Finale. A ribbon of light — the red silk, one more time — draws an infinity
// sign, then writes her name and finishes with a small heart.
// 90 s+ · End card: the footnote from the title, typed out.
(function () {
const IJ = window.IJ;
const C = IJ.CUES;
const START = 81;
const TRAIL = 260;

const BG_FS = `
in vec2 vUv; out vec4 o;
uniform float uT, uL, uGlow;
void main(){
  vec2 p = (2.*gl_FragCoord.xy - uRes)/uRes.y;
  vec3 c = mix(vec3(.05,.035,.09), vec3(.01,.01,.03), sat(p.y*.5 + .5));
  c += vec3(.25,.08,.12)*exp(-length(p*vec2(.6, 1.2))*1.6)*.35*uGlow;
  vec2 g = p*38.; vec2 id = floor(g);
  float h = hash12(id);
  if (h > .9) c += vec3(.8,.85,1.)*smoothstep(.12, 0., length(fract(g) - .5 - (hash22(id) - .5)*.6))*(.35 + .65*sin(uT*(1.5 + h*4.) + h*30.))*(h - .9)*6.;
  o = vec4(c, 1.);
}`;

const RIB_VS = `#version 300 es
layout(location=0) in vec3 aP; layout(location=1) in vec2 aUV; layout(location=2) in vec3 aX;
uniform float uAspect;
out vec2 vUv; out vec3 vX;
void main(){ vUv = aUV; vX = aX; gl_Position = vec4(aP.x/uAspect, aP.y, 0., 1.); }`;
const RIB_FS = `
in vec2 vUv; in vec3 vX; out vec4 o;
void main(){
  float tw = vX.x, s = vX.y, a = vX.z;             // twist, position along the trail (0 tail .. 1 head), alpha
  float facing = abs(cos(tw));
  float across = 1. - abs(vUv.x);
  float sheen = pow(across, 3.)*(.4 + .6*facing);
  vec3 silk = mix(vec3(.75,.06,.1), vec3(1.,.45,.3), sheen);
  silk = mix(silk, vec3(1.,.85,.55), smoothstep(.85, 1., s)*.8);   // the head burns gold
  float edge = smoothstep(0., .35, across);
  float k = edge*(.35 + .65*facing)*a;
  o = vec4(silk*k*1.4, k);
}`;

function lemniscate(u) {                    // one loop of ∞, starting at the crossing
  const t = u * Math.PI * 2 - Math.PI / 2;
  const d = 1 + Math.sin(t) * Math.sin(t);
  return [Math.cos(t) / d, Math.sin(t) * Math.cos(t) / d];
}
// a loopy, handwriting-like path across the word (the script itself is revealed as it passes)
const WORD = (() => {
  const B = (p0, p1, p2, p3, n = 24) => { const out = []; for (let i = 0; i < n; i++) { const t = i / n, m = 1 - t; out.push([m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0], m * m * m * p0[1] + 3 * m * m * t * p1[1] + 3 * m * t * t * p2[1] + t * t * t * p3[1]]); } return out; };
  const segs = [
    [[-1.05, 0.1], [-0.95, 0.42], [-0.75, 0.58], [-0.6, 0.5]],       // J: entry up to the cap
    [[-0.6, 0.5], [-0.5, 0.42], [-0.55, 0.1], [-0.66, -0.2]],        // stem down
    [[-0.66, -0.2], [-0.74, -0.5], [-0.95, -0.45], [-0.82, -0.25]],  // descender loop
    [[-0.82, -0.25], [-0.7, -0.08], [-0.45, -0.02], [-0.3, 0.0]],    // into e
    [[-0.3, 0.0], [-0.15, 0.08], [-0.15, 0.2], [-0.24, 0.18]],       // e loop
    [[-0.24, 0.18], [-0.34, 0.14], [-0.3, -0.06], [-0.08, -0.02]],
    [[-0.08, -0.02], [0.02, 0.1], [0.08, 0.2], [0.12, 0.2]],         // s
    [[0.12, 0.2], [0.26, 0.1], [0.24, -0.08], [0.1, -0.04]],
    [[0.1, -0.04], [0.22, 0.02], [0.3, 0.1], [0.4, 0.2]],            // s
    [[0.4, 0.2], [0.56, 0.1], [0.52, -0.08], [0.38, -0.04]],
    [[0.38, -0.04], [0.55, 0.0], [0.72, 0.08], [0.82, 0.2]],         // exit flourish
  ];
  const pts = [];
  segs.forEach(s => pts.push(...B(...s)));
  return pts;
})();
const WORD_BOX = [-1.05, -0.5, 0.82, 0.58];   // x0, y0, x1, y1 of the path above
// the ink bounds of a text texture, in texture pixels
function inkBox(tex) {
  const c = tex.canvas, d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let y = 0; y < c.height; y += 2) for (let x = 0; x < c.width; x += 2) {
    if (d[(y * c.width + x) * 4 + 3] > 40) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  }
  return { x0, y0, x1, y1 };
}
function samplePath(pts, u) {
  const f = IJ.clamp(u) * (pts.length - 1), i = Math.floor(f), k = f - i;
  const a = pts[i], b = pts[Math.min(i + 1, pts.length - 1)];
  return [IJ.lerp(a[0], b[0], k), IJ.lerp(a[1], b[1], k)];
}

IJ.registerScene({
  name: 'finale', start: START, end: 90, transition: { type: 'fade', dur: 2.0 },
  post: { bloom: 0.9, grain: 0.03, vignette: 0.5, thresh: 0.35 },
  init() {
    this.bg = IJ.program(BG_FS, null, 'finalebg');
    this.rib = IJ.program(RIB_FS, RIB_VS, 'ribbon');
    this.mesh = IJ.Mesh(TRAIL * 2 * 3 + 16);
    this.sparks = IJ.Points(500);
    this.word = IJ.text('Jess', { font: 'script', size: 260, pad: 0.45 });
    // fit: the glyphs' ink ~0.8 tall; the ribbon path mapped onto the ink box; a heart after it
    const ink = inkBox(this.word), T = this.word;
    const inkH = (ink.y1 - ink.y0) / T.h, inkW = (ink.x1 - ink.x0) / T.w;
    const h = 0.82 / inkH, w = h * T.aspect;
    const total = inkW * w + 0.55;
    const cx = -total / 2 + (0.5 - ink.x0 / T.w) * w;     // sprite centre so word+heart is centred
    const cy = 0.02;
    const X = u => cx + (u / T.w - 0.5) * w, Y = v => cy - (v / T.h - 0.5) * h;
    const g = [X(ink.x0), Y(ink.y1), X(ink.x1), Y(ink.y0)];
    this.layout = { h, cx, cy };
    this.path = WORD.map(([x, y]) => [
      g[0] + (x - WORD_BOX[0]) / (WORD_BOX[2] - WORD_BOX[0]) * (g[2] - g[0]),
      g[1] + (y - WORD_BOX[1]) / (WORD_BOX[3] - WORD_BOX[1]) * (g[3] - g[1]),
    ]);
    const hc = [g[2] + 0.3, g[1] + (g[3] - g[1]) * 0.6];
    const last = this.path[this.path.length - 1];
    for (let i = 1; i <= 8; i++) this.path.push([IJ.lerp(last[0], hc[0], i / 8), IJ.lerp(last[1], hc[1] + 0.12, i / 8)]);
    for (let i = 0; i <= 60; i++) {
      const a = i / 60 * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(a), 3) / 17, y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17;
      this.path.push([hc[0] + x * 0.2, hc[1] + y * 0.2]);
    }
    this.heartPath = this.path.slice(this.path.length - 61);
    this.heartC = hc;
    this.wordEnd = WORD.length / this.path.length;
  },
  // draw a ribbon along points [[x,y], ...] with per-point alpha
  ribbon(pts, width, alphaFn, t) {
    const M = this.mesh, n = pts.length;
    if (n < 2) return;
    const start = M.count;
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const s = i / (n - 1);
      const tw = i * 0.22 + t * 2.2;
      const taper = Math.min(1, s * 6) * (1 - Math.pow(Math.max(0, s - 0.9) / 0.1, 2) * 0.6);
      const w = width * taper * (0.35 + 0.65 * Math.abs(Math.cos(tw)));
      const al = alphaFn(s);
      M.v(pts[i][0] - ty * w, pts[i][1] + tx * w, 0, -1, s, tw, s, al);
      M.v(pts[i][0] + ty * w, pts[i][1] - tx * w, 0, 1, s, tw, s, al);
    }
    return [start, n * 2];
  },
  render(t, l) {
    const gl = IJ.gl;
    const glow = IJ.smooth(0, 1.5, l);
    this.bg.draw({ uT: t, uL: l, uGlow: glow });
    const M = this.mesh; M.clear();
    const S = this.sparks; S.clear();
    const draws = [];
    const R = IJ.rng(Math.floor(t * 30));
    const spark = (p, n, amt) => { for (let i = 0; i < n; i++) S.add(p[0] + (R() - 0.5) * 0.06, p[1] + (R() - 0.5) * 0.06, 0, 0.004 + R() * 0.006, 1, 0.8, 0.5, amt * R(), 1, R() > 0.8 ? 0.6 : 0); };

    // ---- ∞, drawn in perspective, then fading as the name is written
    const i0 = C.ribbonInf - START, j0 = C.ribbonJess - START, s0 = C.signoff - START;
    const infU = IJ.ease.inOut(IJ.clamp((l - i0) / 2.4));
    const infFade = 1 - IJ.smooth(j0 + 0.2, j0 + 1.6, l);
    if (infU > 0 && infFade > 0) {
      const tilt = 0.45 + 0.1 * Math.sin(l * 0.6), spin = l * 0.25;
      const proj = (u) => {
        const [x, y] = lemniscate(u);
        let X = x * 0.95, Y = y * 0.95, Z = 0;
        const cs = Math.cos(spin), sn = Math.sin(spin);
        [X, Z] = [X * cs - Z * sn * 0.2, X * sn * 0.2 + Z * cs];
        [Y, Z] = [Y * Math.cos(tilt) - Z * Math.sin(tilt), Y * Math.sin(tilt) + Z * Math.cos(tilt)];
        const f = 3 / (3 + Z + X * 0.25);
        return [X * f * 0.95, 0.05 + Y * f * 0.95];
      };
      const pts = [];
      for (let i = 0; i <= TRAIL; i++) pts.push(proj(infU * i / TRAIL));
      draws.push(this.ribbon(pts, 0.03, s => 0.9 * infFade, t));
      if (infU < 1) spark(pts[pts.length - 1], 6, 1);
    }
    // ---- her name: the ribbon sweeps across; the script is revealed in its wake
    const wU = IJ.clamp((l - j0 - 0.3) / 2.6);
    let head = null;
    if (wU > 0) {
      const pts = [];
      const tailU = Math.max(0, wU - 0.3);
      for (let i = 0; i <= TRAIL; i++) pts.push(samplePath(this.path, IJ.lerp(tailU, wU, i / TRAIL)));
      head = pts[pts.length - 1];
      const fadeRib = 1 - IJ.smooth(s0 + 0.2, s0 + 1.4, l);
      draws.push(this.ribbon(pts, 0.024, s => (0.25 + 0.75 * s) * fadeRib, t));
      if (wU < 1) spark(head, 5, 0.6);
    }
    const heartDone = IJ.smooth(this.wordEnd + (1 - this.wordEnd) * 0.95, 1, wU);
    if (heartDone > 0) draws.push(this.ribbon(this.heartPath, 0.02, s => 0.85 * heartDone * (0.85 + 0.15 * Math.sin(l * 4)), t));
    M.upload();
    IJ.blend('add');
    this.rib.use().set({ uAspect: IJ.aspect() });
    for (const d of draws) if (d) M.draw(gl.TRIANGLE_STRIP, d[0], d[1]);

    // the script itself, revealed left to right behind the ribbon's head
    if (wU > 0) {
      const { h, cx, cy } = this.layout, w = h * this.word.aspect;
      const hx = head ? head[0] : 9;
      const wipe = wU >= this.wordEnd ? 1 : IJ.clamp((hx - (cx - w / 2)) / w + 0.03);
      const done = IJ.smooth(s0 - 0.2, s0 + 0.6, l);
      const reveal = Math.max(wipe, done);
      IJ.sprite(this.word, { x: cx, y: cy, h, alpha: 0.85, color: [1, 0.55, 0.45], blur: 2.5, wipe: reveal, soft: 0.06, blend: 'add' });
      IJ.sprite(this.word, { x: cx, y: cy, h, alpha: 1, color: [1, 0.9, 0.78], wipe: reveal, soft: 0.04 });
      if (done > 0) IJ.sprite(this.word, { x: cx, y: cy, h, alpha: 0.5 * done * (0.8 + 0.2 * Math.sin(l * 3)), color: [1, 0.7, 0.4], blur: 4, blend: 'add' });
    }
    // a burst on the final chord
    if (l > s0 && l < s0 + 2.5) {
      const k = (l - s0) / 2.5;
      const RR = IJ.rng(77);
      for (let i = 0; i < 120; i++) {
        const a = RR() * Math.PI * 2, sp = 0.35 + RR() * 0.9;
        const x = this.heartC[0] + Math.cos(a) * sp * k, y = this.heartC[1] + Math.sin(a) * sp * k - 0.15 * k * k;
        S.add(x, y, 0, 0.004 + RR() * 0.005, 1, 0.75 + RR() * 0.25, 0.55, (1 - k) * 0.7 * Math.min(1, k * 8), 0.8, RR() > 0.7 ? 0.5 : 0);
      }
    }
    S.draw();
  },
});

// ------------------------------------------------------------------ end card ---
const NOTE = C.endnote.lines;

IJ.registerScene({
  name: 'endcard', start: 90, end: 1e9, transition: { type: 'black', dur: 2.0 },
  post: { bloom: 0.3, grain: 0.035, vignette: 0.5, thresh: 0.6 },
  init() {
    this.bg = IJ.program(`
in vec2 vUv; out vec4 o; uniform float uT;
void main(){
  vec2 p = (2.*gl_FragCoord.xy - uRes)/uRes.y;
  vec3 c = vec3(.07,.065,.06) + .02*fbm(p*3.) - .012*fbm(p*40.);
  c *= 1. - .3*length(p*vec2(.5,.8));
  o = vec4(c, 1.);
}`, null, 'endbg');
    this.lines = NOTE.map(s => IJ.text(s, { font: "'Courier New', Courier, monospace", size: 72, pad: 0.2 }));
    this.sig = IJ.text('Love, Sam', { font: 'script', size: 150, pad: 0.4 });
    this.hint = IJ.text('R · watch again      E · save as video', { font: 'sans', size: 44, spacing: 0.2 });
  },
  render(t, l) {
    this.bg.draw({ uT: t });
    const E = C.endnote;
    let clock = t - E.start;
    const h = 0.12, left = -1.62;
    this.lines.forEach((tx, i) => {
      const n = NOTE[i].length;
      const shown = IJ.clamp(Math.floor(clock * E.cps) / n);
      clock -= n / E.cps + E.gap;
      if (shown <= 0) return;
      // character-quantized wipe (monospaced), text left-aligned
      const w = h * tx.aspect, padFrac = (0.2 * 72) / tx.w;
      const wipe = padFrac + shown * (1 - 2 * padFrac);
      IJ.sprite(tx, { x: left + w / 2, y: 0.36 - i * 0.2, h, alpha: 0.94, color: [0.93, 0.9, 0.84], wipe, soft: 0.001 });
    });
    const sigA = IJ.smooth(0.2, 1.2, clock);
    if (sigA > 0) IJ.sprite(this.sig, { x: 0.85, y: -0.36, h: 0.36, alpha: sigA, color: [1, 0.82, 0.74], wipe: IJ.clamp(clock / 1.2), soft: 0.1 });
    const hintA = IJ.exporting ? 0 : IJ.smooth(2.5, 3.5, clock) * 0.35;
    if (hintA > 0) IJ.sprite(this.hint, { x: 0, y: -0.82, h: 0.05, alpha: hintA, color: [0.9, 0.88, 0.84] });
  },
});
})();

// ---- js/mp4.js
// INFINITE JESS — a small MP4 (ISO BMFF) muxer for the video export: H.264 video + AAC
// audio, interleaved one-second chunks, moov before mdat so it streams and scrubs well.
(function () {
'use strict';
const IJ = window.IJ;
const ascii = s => new Uint8Array([...s].map(c => c.charCodeAt(0)));
const u8 = n => new Uint8Array([n & 255]);
const u16 = n => new Uint8Array([(n >>> 8) & 255, n & 255]);
const u24 = n => new Uint8Array([(n >>> 16) & 255, (n >>> 8) & 255, n & 255]);
const u32 = n => new Uint8Array([(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]);
const zeros = n => new Uint8Array(n);
function cat(parts) {
  let len = 0; for (const p of parts) len += p.length;
  const out = new Uint8Array(len); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
const box = (type, ...parts) => { const body = cat(parts); return cat([u32(body.length + 8), ascii(type), body]); };
const full = (type, version, flags, ...parts) => box(type, u8(version), u24(flags), ...parts);
const MATRIX = cat([u32(0x00010000), u32(0), u32(0), u32(0), u32(0x00010000), u32(0), u32(0), u32(0), u32(0x40000000)]);
// MPEG-4 descriptor with a single-byte length
const desc = (tag, ...parts) => { const body = cat(parts); return cat([u8(tag), u8(body.length), body]); };

function runs(values) { // run-length encode for stts
  const out = [];
  for (const v of values) { const last = out[out.length - 1]; if (last && last[1] === v) last[0]++; else out.push([1, v]); }
  return out;
}

// video: { chunks: [{data, key}], avcC, width, height, fps }
// audio: { chunks: [{data}], asc, sampleRate, channels, priming }
IJ.muxMP4 = function (video, audio) {
  const VTS = video.fps * 1000;                    // video media timescale
  const vDur = video.chunks.length * 1000;         // in VTS
  const aDur = audio.chunks.length * 1024;         // in sampleRate
  const secs = Math.max(video.chunks.length / video.fps, (aDur - audio.priming) / audio.sampleRate);
  const movieDur = Math.round(secs * 1000);

  // interleave: one chunk of each track per second
  const chunks = [];                               // {track, samples:[i...]}
  const vPerChunk = video.fps, aPerChunk = Math.round(audio.sampleRate / 1024);
  const nSec = Math.ceil(Math.max(video.chunks.length / vPerChunk, audio.chunks.length / aPerChunk));
  for (let s = 0; s < nSec; s++) {
    const v = [], a = [];
    for (let i = s * vPerChunk; i < Math.min(video.chunks.length, (s + 1) * vPerChunk); i++) v.push(i);
    for (let i = s * aPerChunk; i < Math.min(audio.chunks.length, (s + 1) * aPerChunk); i++) a.push(i);
    if (v.length) chunks.push({ track: 0, samples: v });
    if (a.length) chunks.push({ track: 1, samples: a });
  }
  const trackChunks = t => chunks.filter(c => c.track === t);
  const stsc = cs => {
    const entries = [];
    cs.forEach((c, i) => { const last = entries[entries.length - 1]; if (!last || last[1] !== c.samples.length) entries.push([i + 1, c.samples.length]); });
    return full('stsc', 0, 0, u32(entries.length), ...entries.map(([f, n]) => cat([u32(f), u32(n), u32(1)])));
  };
  const stco = offsets => full('stco', 0, 0, u32(offsets.length), ...offsets.map(u32));
  const stsz = list => full('stsz', 0, 0, u32(0), u32(list.length), ...list.map(c => u32(c.data.length)));

  function build(offsets) {
    const vChunks = trackChunks(0), aChunks = trackChunks(1);
    const vOff = offsets.filter((_, i) => chunks[i].track === 0), aOff = offsets.filter((_, i) => chunks[i].track === 1);
    // ---- video track
    const avc1 = box('avc1', zeros(6), u16(1), u16(0), u16(0), zeros(12), u16(video.width), u16(video.height),
      u32(0x00480000), u32(0x00480000), u32(0), u16(1), cat([u8(11), ascii('INFINITEJESS'.slice(0, 11)), zeros(20)]),
      u16(0x0018), u16(0xffff), box('avcC', video.avcC),
      box('colr', ascii('nclx'), u16(1), u16(1), u16(1), u8(0)), box('pasp', u32(1), u32(1)));
    const keys = video.chunks.map((c, i) => c.key ? i + 1 : 0).filter(Boolean);
    const vstbl = box('stbl',
      full('stsd', 0, 0, u32(1), avc1),
      full('stts', 0, 0, u32(1), u32(video.chunks.length), u32(1000)),
      full('stss', 0, 0, u32(keys.length), ...keys.map(u32)),
      stsc(vChunks), stsz(video.chunks), stco(vOff));
    const vtrak = box('trak',
      full('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(Math.round(video.chunks.length / video.fps * 1000)), zeros(8), u16(0), u16(0), u16(0), u16(0), MATRIX, u32(video.width << 16), u32(video.height << 16)),
      box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(VTS), u32(vDur), u16(0x55c4), u16(0)),
        full('hdlr', 0, 0, u32(0), ascii('vide'), zeros(12), ascii('VideoHandler'), u8(0)),
        box('minf', full('vmhd', 0, 1, zeros(8)), box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))), vstbl)));
    // ---- audio track
    const esds = full('esds', 0, 0, desc(0x03, u16(2), u8(0),
      desc(0x04, u8(0x40), u8(0x15), u24(0), u32(256000), u32(256000), desc(0x05, audio.asc)),
      desc(0x06, u8(0x02))));
    const mp4a = box('mp4a', zeros(6), u16(1), zeros(8), u16(audio.channels), u16(16), u16(0), u16(0), u32(audio.sampleRate << 16), esds);
    const astbl = box('stbl',
      full('stsd', 0, 0, u32(1), mp4a),
      full('stts', 0, 0, u32(1), u32(audio.chunks.length), u32(1024)),
      stsc(aChunks), stsz(audio.chunks), stco(aOff));
    const aShown = Math.round((aDur - audio.priming) / audio.sampleRate * 1000);
    const atrak = box('trak',
      full('tkhd', 0, 3, u32(0), u32(0), u32(2), u32(0), u32(aShown), zeros(8), u16(0), u16(1), u16(0x0100), u16(0), MATRIX, u32(0), u32(0)),
      // the encoder's priming samples are skipped with an edit list, keeping picture and sound in sync
      box('edts', full('elst', 0, 0, u32(1), u32(aShown), u32(audio.priming), u32(0x00010000))),
      box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(audio.sampleRate), u32(aDur), u16(0x55c4), u16(0)),
        full('hdlr', 0, 0, u32(0), ascii('soun'), zeros(12), ascii('SoundHandler'), u8(0)),
        box('minf', full('smhd', 0, 0, u16(0), u16(0)), box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))), astbl)));
    const mvhd = full('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(movieDur), u32(0x00010000), u16(0x0100), zeros(10), MATRIX, zeros(24), u32(3));
    return box('moov', mvhd, vtrak, atrak);
  }

  const ftyp = box('ftyp', ascii('isom'), u32(0x200), ascii('isom'), ascii('iso2'), ascii('avc1'), ascii('mp41'));
  const sizes = chunks.map(c => c.samples.reduce((s, i) => s + (c.track === 0 ? video.chunks[i] : audio.chunks[i]).data.length, 0));
  const moovLen = build(chunks.map(() => 0)).length;
  const dataStart = ftyp.length + moovLen + 8;
  const offsets = []; let o = dataStart;
  for (const s of sizes) { offsets.push(o); o += s; }
  const moov = build(offsets);
  const mdatLen = o - dataStart + 8;
  const parts = [ftyp, moov, cat([u32(mdatLen), ascii('mdat')])];
  for (const c of chunks) for (const i of c.samples) parts.push((c.track === 0 ? video.chunks[i] : audio.chunks[i]).data);
  return new Blob(parts, { type: 'video/mp4' });
};
})();

// ---- js/export.js
// INFINITE JESS — export the film to an MP4, frame by frame (never dropping a frame), with
// the same mix you hear when it plays. Uses the browser's own encoders (WebCodecs).
(function () {
'use strict';
const IJ = window.IJ;
const SECONDS = 99;          // the film, the typed footnote, and a fade to black

async function pick(list, test) { for (const c of list) { try { if ((await test(c)).supported) return c; } catch (e) { /* try the next */ } } return null; }

IJ.exportVideo = async function ({ fps = 60, width = 1920, height = 1080, bitrate = 20e6, onProgress = () => {}, log = () => {} } = {}) {
  if (typeof VideoEncoder === 'undefined' || typeof AudioEncoder === 'undefined') throw new Error('This browser has no WebCodecs video/audio encoders (try Chrome or Edge).');
  const film = IJ.film, SR = IJ.audio.SR;
  // ---- codecs
  const vcfg = await pick(['avc1.640032', 'avc1.64002A', 'avc1.4D4032', 'avc1.42E032'].flatMap(codec => ['prefer-hardware', 'no-preference'].map(hw => ({
    codec, width, height, bitrate, framerate: fps, hardwareAcceleration: hw, avc: { format: 'avc' }, latencyMode: 'quality',
  }))), c => VideoEncoder.isConfigSupported(c));
  if (!vcfg) throw new Error('No H.264 encoder available at ' + width + 'x' + height);
  const acfg = { codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 256000 };
  if (!(await AudioEncoder.isConfigSupported(acfg)).supported) throw new Error('No AAC encoder available');
  log(`video ${vcfg.codec} (${vcfg.hardwareAcceleration}) ${(bitrate / 1e6).toFixed(1)} Mbps, audio AAC ${SR} Hz`);

  // ---- the mix: every chunk of the score, through the same compressor used for playback
  if (!IJ.audio.all) await IJ.audio.render();
  await IJ.audio.all;
  const [L, R] = IJ.audio.mixdown();
  const total = Math.ceil(SECONDS * SR);
  const oac = new OfflineAudioContext(2, total, SR);
  const src = oac.createBuffer(2, total, SR);
  src.copyToChannel(L.subarray(0, Math.min(L.length, total)), 0);
  src.copyToChannel(R.subarray(0, Math.min(R.length, total)), 1);
  const node = oac.createBufferSource(); node.buffer = src;
  const comp = oac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.008; comp.release.value = 0.3;
  const gain = oac.createGain(); gain.gain.value = 1.45;
  gain.gain.setValueAtTime(1.45, SECONDS - 1.6); gain.gain.linearRampToValueAtTime(0, SECONDS - 0.2);
  node.connect(comp); comp.connect(gain); gain.connect(oac.destination); node.start(0);
  const mixed = await oac.startRendering();
  onProgress(0.02, 'sound mixed');

  // ---- encode the sound
  const aChunks = []; let asc = null, aErr = null;
  const aenc = new AudioEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) asc = new Uint8Array(meta.decoderConfig.description);
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d); aChunks.push({ data: d });
    },
    error: e => { aErr = e; },
  });
  aenc.configure(acfg);
  const BL = 4096, cl = mixed.getChannelData(0), cr = mixed.getChannelData(1);
  for (let off = 0; off < total; off += BL) {
    const n = Math.min(BL, total - off), data = new Float32Array(n * 2);
    data.set(cl.subarray(off, off + n), 0); data.set(cr.subarray(off, off + n), n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(off / SR * 1e6), data });
    aenc.encode(ad); ad.close();
  }
  await aenc.flush();
  if (aErr) throw aErr;
  if (!asc) asc = new Uint8Array([0x12, 0x10]);        // AAC-LC, 44.1 kHz, stereo
  // AAC encoders prepend "priming" samples; measure them so the edit list can skip them
  const extra = aChunks.length * 1024 - total;
  const priming = extra >= 1024 && extra <= 4096 ? (extra >= 2112 ? 2112 : 1024) : 0;
  log(`audio: ${aChunks.length} AAC frames, priming ${priming}`);

  // ---- render and encode every frame
  const vChunks = []; let avcC = null, vErr = null;
  const venc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) avcC = new Uint8Array(meta.decoderConfig.description);
      const d = new Uint8Array(chunk.byteLength); chunk.copyTo(d);
      vChunks.push({ data: d, key: chunk.type === 'key', ts: chunk.timestamp });
    },
    error: e => { vErr = e; },
  });
  venc.configure(vcfg);
  const wasPlaying = film.playing; if (wasPlaying) film.pause();
  IJ.exporting = true; IJ.exportFadeOut = SECONDS - 1.4;
  film.setSize(width, height);
  const canvas = document.getElementById('film');
  const N = Math.round(SECONDS * fps), t0 = performance.now();
  try {
    for (let i = 0; i < N; i++) {
      film.render(i / fps);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
      venc.encode(frame, { keyFrame: i % (fps * 2) === 0 });
      frame.close();
      if (vErr) throw vErr;
      while (venc.encodeQueueSize > 4) await new Promise(r => setTimeout(r, 2));
      if (i % 20 === 0) {
        const k = i / N, el = (performance.now() - t0) / 1000;
        onProgress(0.02 + 0.96 * k, `frame ${i} / ${N}` + (k > 0.02 ? ` · ${Math.round(el / k - el)} s left` : ''));
        await new Promise(r => setTimeout(r, 0));
      }
    }
    await venc.flush();
    if (vErr) throw vErr;
  } finally {
    IJ.exporting = false; IJ.exportFadeOut = null;
    film.setSize(null);
  }
  // frames must come back in order (no B-frame reordering) for this simple muxer
  for (let i = 1; i < vChunks.length; i++) if (vChunks[i].ts < vChunks[i - 1].ts) throw new Error('encoder reordered frames');
  log(`video: ${vChunks.length} frames in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  const blob = IJ.muxMP4(
    { chunks: vChunks, avcC, width, height, fps },
    { chunks: aChunks, asc, sampleRate: SR, channels: 2, priming },
  );
  onProgress(1, 'done');
  return blob;
};

// ---- the user-facing export: press E, get InfiniteJess.mp4
function overlay() {
  let el = document.getElementById('export');
  if (!el) {
    el = document.createElement('div'); el.id = 'export';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 18px;border-radius:8px;background:rgba(0,0,0,.72);color:#efe7da;font:13px/1.4 "Avenir Next","Helvetica Neue",sans-serif;letter-spacing:.04em;z-index:9';
    document.body.appendChild(el);
  }
  return el;
}
IJ.exportToDownload = async function () {
  const el = overlay();
  try {
    const blob = await IJ.exportVideo({ onProgress: (k, msg) => { el.textContent = `exporting video · ${Math.round(k * 100)}% · ${msg}`; } });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'InfiniteJess.mp4';
    document.body.appendChild(a); a.click(); a.remove();
    el.textContent = `saved InfiniteJess.mp4 (${(blob.size / 1048576).toFixed(0)} MB)`;
  } catch (e) {
    el.textContent = 'export failed: ' + e.message;
    console.error(e);
  }
  setTimeout(() => el.remove(), 6000);
};

// ---- the headless tool (tools/export.py): ?export=auto posts the file back to it
if (/[?&]export=auto/.test(location.search)) {
  const post = (path, body) => fetch(path, { method: 'POST', body });
  let last = -1;
  const q = new URLSearchParams(location.search);
  const name = (q.get('name') || 'InfiniteJess.mp4').replace(/[^\w.-]/g, '');
  window.addEventListener('load', () => setTimeout(async () => {
    try {
      const blob = await IJ.exportVideo({
        bitrate: (+q.get('mbps') || 20) * 1e6,
        onProgress: (k, msg) => { if (k - last >= 0.025 || k === 1) { last = k; post('/__log', `${(k * 100).toFixed(1)}% ${msg}`); } },
        log: m => post('/__log', m),
      });
      await post('/__result/' + name, blob);
    } catch (e) {
      await post('/__error', String((e && e.stack) || e));
    }
  }, 300));
}
})();

</script>
<script>
// ---- js/film.js
// INFINITE JESS — the projector: timeline, transitions, post, transport, controls.
(function () {
'use strict';
const IJ = window.IJ;
const FILM_LEN = 90;
const params = new URLSearchParams(location.search);

let gl, canvas, W = 0, H = 0;
let resScale = 1;                 // lowered automatically on slower GPUs
let forced = null;                // [w, h] while exporting
let rtA, rtB, rtComp, bloomH, bloomQ1, bloomQ2, bloomE1, bloomE2;
let progComp, progBright, progBlur, progFinal;

// --------------------------------------------------------------- shaders ---
const COMP_FS = `
in vec2 vUv; out vec4 o;
uniform sampler2D uA, uB; uniform float uP; uniform int uType;
vec3 sampleA(vec2 uv){ return texture(uA, uv).rgb; }
void main(){
  vec2 uv = vUv; float p = clamp(uP, 0., 1.);
  vec3 a, b = texture(uB, uv).rgb, c;
  if (uType == 0) { a = sampleA(uv); c = mix(a, b, smoothstep(0.,1.,p)); }
  else if (uType == 1 || uType == 2) {
    vec3 mid = uType == 1 ? vec3(1.,.98,.94)*1.4 : vec3(0.);
    a = sampleA(uv);
    c = p < .5 ? mix(a, mid, smoothstep(0.,1.,p*2.)) : mix(mid, b, smoothstep(0.,1.,p*2.-1.));
  } else if (uType == 3) {
    a = sampleA(uv);
    float n = fbm(uv*vec2(uRes.x/uRes.y,1.)*3.5) * .8 + fbm(uv*18.)*.2;
    float e = p*1.25 - .12;
    float m = smoothstep(e-.08, e+.02, n);
    float edge = smoothstep(.12, 0., abs(n - e + .03));
    c = mix(b, a, m) * (1. - .35*edge*(1.-abs(p-.5)*2.));
  } else if (uType == 4) {
    float blocks = floor(uv.y*24.) + floor(uTime*20.)*7.;
    float r = hash11(blocks);
    float g = sin(p*PI);
    vec2 off = vec2((r-.5)*.25*g*step(.55, r), 0.);
    float sw = step(r*.8+.1, p);
    vec2 uv2 = uv + off;
    a = vec3(texture(uA, uv2+vec2(.012*g,0)).r, texture(uA, uv2).g, texture(uA, uv2-vec2(.012*g,0)).b);
    vec3 bb = vec3(texture(uB, uv2+vec2(.012*g,0)).r, texture(uB, uv2).g, texture(uB, uv2-vec2(.012*g,0)).b);
    c = mix(a, bb, sw);
    c += g*.15*step(.93, hash12(floor(uv*vec2(60.,40.)) + floor(uTime*30.)));
  } else if (uType == 5) {
    vec2 q = (uv-.5)*vec2(uRes.x/uRes.y,1.);
    float r = p < .5 ? mix(1.2, 0., smoothstep(0.,1.,p*2.)) : mix(0., 1.2, smoothstep(0.,1.,p*2.-1.));
    float inside = 1. - smoothstep(r-.004, r+.004, length(q));
    a = sampleA(uv);
    c = (p < .5 ? a : b) * inside;
  } else {
    // zoom-through: A pushes in with radial smear, B emerges
    vec2 d = uv - .5; vec3 acc = vec3(0.);
    float z = 1. + p*p*6.;
    for (int i=0;i<10;i++){ float k = float(i)/10.; acc += texture(uA, .5 + d/(z*(1.+k*p*.35))).rgb; }
    a = acc/10.;
    c = mix(a, b, smoothstep(.45, 1., p));
  }
  o = vec4(c, 1.);
}`;

const BRIGHT_FS = `
in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThresh;
void main(){
  vec3 c = vec3(0.);
  c += texture(uTex, vUv + uTexel*vec2(-.5,-.5)).rgb; c += texture(uTex, vUv + uTexel*vec2(.5,-.5)).rgb;
  c += texture(uTex, vUv + uTexel*vec2(-.5,.5)).rgb;  c += texture(uTex, vUv + uTexel*vec2(.5,.5)).rgb;
  c *= .25;
  float l = max(c.r, max(c.g, c.b));
  float k = smoothstep(uThresh, uThresh + .35, l);
  o = vec4(c*k, 1.);
}`;

const BLUR_FS = `
in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  vec3 c = texture(uTex, vUv).rgb * .2270270270;
  c += texture(uTex, vUv + uDir*1.3846153846).rgb * .3162162162;
  c += texture(uTex, vUv - uDir*1.3846153846).rgb * .3162162162;
  c += texture(uTex, vUv + uDir*3.2307692308).rgb * .0702702703;
  c += texture(uTex, vUv - uDir*3.2307692308).rgb * .0702702703;
  o = vec4(c, 1.);
}`;

const FINAL_FS = `
in vec2 vUv; out vec4 o;
uniform sampler2D uScene, uB1, uB2; uniform float uBloom, uGrain, uVig, uFade, uSeed;
void main(){
  vec3 c = texture(uScene, vUv).rgb;
  vec3 b = texture(uB1, vUv).rgb*.7 + texture(uB2, vUv).rgb*.9;
  c += b*uBloom;
  float k = .82; vec3 over = max(c-k, 0.);
  c = min(c, vec3(k)) + (1.-k)*(1.-exp(-over/(1.-k)));
  vec2 q = (vUv-.5)*vec2(uRes.x/uRes.y, 1.);
  c *= mix(1., smoothstep(1.25, .25, length(q)), uVig);
  float g = hash12(vUv*uRes + uSeed*113.1) + hash12(vUv*uRes*1.37 - uSeed*71.7) - 1.;
  c += g*uGrain*(.6 + .4*luma(c));
  c += (hash12(vUv*uRes + 3.7) - .5)/255.;
  o = vec4(max(c,0.)*uFade, 1.);
}`;

// ------------------------------------------------------------- sizing ---
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let cw = vw, ch = vw * 9 / 16;
  if (ch > vh) { ch = vh; cw = vh * 16 / 9; }
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cap = +params.get('res') || 1920;
  const w = forced ? forced[0] : Math.round(Math.min(cw * dpr, cap) * resScale), h = forced ? forced[1] : Math.round(w * 9 / 16);
  if (w === W && h === H) return;
  W = w; H = h;
  canvas.width = W; canvas.height = H;
  IJ.W = W; IJ.H = H;
  for (const r of [rtA, rtB, rtComp, bloomH, bloomQ1, bloomQ2, bloomE1, bloomE2]) if (r) r.dispose();
  rtA = IJ.fbo(W, H, { depth: true });
  rtB = IJ.fbo(W, H, { depth: true });
  rtComp = IJ.fbo(W, H);
  bloomH = IJ.fbo(W >> 1, H >> 1);
  bloomQ1 = IJ.fbo(W >> 2, H >> 2); bloomQ2 = IJ.fbo(W >> 2, H >> 2);
  bloomE1 = IJ.fbo(W >> 3, H >> 3); bloomE2 = IJ.fbo(W >> 3, H >> 3);
  for (const s of IJ.scenes) if (s.resize) s.resize(W, H);
  if (!playing) renderFrame(filmTime);
}

// --------------------------------------------------------- scene lookup ---
function sceneState(t) {
  const S = IJ.scenes;
  for (let i = 0; i < S.length - 1; i++) {
    const next = S[i + 1], tr = next.transition;
    if (tr) {
      const at = next.start, a = at - tr.dur / 2, b = at + tr.dur / 2;
      if (t >= a && t < b) return { A: S[i], B: next, p: (t - a) / tr.dur, type: tr.type };
    }
  }
  for (let i = S.length - 1; i >= 0; i--) if (t >= S[i].start) return { A: S[i] };
  return { A: S[0] };
}
const TYPES = { fade: 0, white: 1, black: 2, dissolve: 3, glitch: 4, iris: 5, zoom: 6 };

function postOf(s, local) {
  const d = { bloom: 0.25, grain: 0.035, vignette: 0.35, thresh: 0.75 };
  const p = typeof s.post === 'function' ? s.post(local) : s.post;
  return Object.assign(d, p || {});
}

function drawScene(s, t, rt) {
  rt.bind();
  IJ.target = rt;
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  IJ.blend(null);
  const local = t - s.start;
  s.render(t, local, s.end - s.start);
  gl.disable(gl.DEPTH_TEST);
  IJ.blend(null);
}

let frameSeed = 0;
function renderFrame(t) {
  if (!W) return;
  IJ.time = t;
  const st = sceneState(t);
  let src = rtA;
  drawScene(st.A, t, rtA);
  let post = postOf(st.A, t - st.A.start);
  if (st.B) {
    drawScene(st.B, t, rtB);
    rtComp.bind();
    progComp.draw({ uA: rtA.tex, uB: rtB.tex, uP: st.p, uType: TYPES[st.type] || 0 });
    src = rtComp;
    const pb = postOf(st.B, t - st.B.start), k = st.p;
    post = { bloom: IJ.lerp(post.bloom, pb.bloom, k), grain: IJ.lerp(post.grain, pb.grain, k), vignette: IJ.lerp(post.vignette, pb.vignette, k), thresh: IJ.lerp(post.thresh, pb.thresh, k) };
  }
  // bloom chain
  bloomH.bind(); progBright.draw({ uTex: src.tex, uTexel: [1 / W, 1 / H], uThresh: post.thresh });
  bloomQ1.bind(); progBlur.draw({ uTex: bloomH.tex, uDir: [2 / W, 0] });
  bloomQ2.bind(); progBlur.draw({ uTex: bloomQ1.tex, uDir: [0, 4 / H] });
  bloomQ1.bind(); progBlur.draw({ uTex: bloomQ2.tex, uDir: [4 / W, 0] });
  bloomQ2.bind(); progBlur.draw({ uTex: bloomQ1.tex, uDir: [0, 4 / H] });
  bloomE1.bind(); progBlur.draw({ uTex: bloomQ2.tex, uDir: [8 / W, 0] });
  bloomE2.bind(); progBlur.draw({ uTex: bloomE1.tex, uDir: [0, 8 / H] });
  bloomE1.bind(); progBlur.draw({ uTex: bloomE2.tex, uDir: [12 / W, 0] });
  bloomE2.bind(); progBlur.draw({ uTex: bloomE1.tex, uDir: [0, 12 / H] });
  // final
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H); IJ.curW = W; IJ.curH = H;
  let fade = 1;
  if (t < 0.05) fade = 0;
  if (IJ.exportFadeOut) fade *= 1 - IJ.smooth(IJ.exportFadeOut, IJ.exportFadeOut + 1.2, t);
  progFinal.draw({ uScene: src.tex, uB1: bloomQ2.tex, uB2: bloomE2.tex, uBloom: post.bloom, uGrain: post.grain, uVig: post.vignette, uFade: fade, uSeed: (frameSeed++ % 97) });
}

// ------------------------------------------------------------ transport ---
let playing = false, filmTime = 0, wallStart = 0, wallOffset = 0, audioReady = false;
const audio = () => IJ.audio;

function now() {
  if (!playing) return filmTime;
  if (audioReady && audio().playing()) {
    const t = audio().time();
    if (t < audio().duration() - 0.05) return t;
  }
  return wallOffset + (performance.now() - wallStart) / 1000;
}
function play(from) {
  if (from != null) filmTime = from;
  if (filmTime >= FILM_LEN + 20) filmTime = 0;
  playing = true;
  wallStart = performance.now(); wallOffset = filmTime;
  if (audioReady && filmTime < audio().duration()) audio().play(filmTime);
  document.body.classList.add('playing');
}
function pause() {
  filmTime = now();
  playing = false;
  if (audioReady) audio().stop();
  document.body.classList.remove('playing');
}
function seek(t) {
  const was = playing;
  if (playing) pause();
  filmTime = Math.max(0, t);
  if (was) play(); else renderFrame(filmTime);
}

let lastT = -1, fpsAcc = 0, fpsN = 0, fpsShown = 0, lastWall = performance.now();
function loop() {
  requestAnimationFrame(loop);
  if (!playing) return;
  const t = now();
  // keep wall clock aligned to the audio clock when it is available
  if (audioReady && audio().playing()) { wallOffset = t; wallStart = performance.now(); }
  filmTime = t;
  renderFrame(t);
  const w = performance.now(), dt = w - lastWall; fpsAcc += dt; fpsN++; lastWall = w;
  if (fpsN >= 30) { fpsShown = 1000 / (fpsAcc / fpsN); fpsAcc = 0; fpsN = 0; }
  adapt(dt);
  updateUI(t);
  lastT = t;
}

// Keep the film smooth on slower machines: if frames run long for a while, render
// fewer pixels (bloom and grain hide the difference); recover when there's headroom.
let ema = 16.7, slowFor = 0, fastFor = 0, lastAdapt = 0;
function adapt(dt) {
  if (dt > 250) return;                               // tab switch / seek, not a real frame
  ema = ema * 0.94 + dt * 0.06;
  const now = performance.now();
  slowFor = ema > 23 ? slowFor + dt : 0;
  fastFor = ema < 14 ? fastFor + dt : 0;
  if (now - lastAdapt < 2500) return;
  if (slowFor > 1200 && resScale > 0.55) { resScale = Math.max(0.55, resScale * 0.84); lastAdapt = now; slowFor = 0; resize(); ema = 16.7; }
  else if (fastFor > 5000 && resScale < 1) { resScale = Math.min(1, resScale * 1.12); lastAdapt = now; fastFor = 0; resize(); ema = 16.7; }
}

// ------------------------------------------------------------------- UI ---
let barEl, progEl, dbgEl;
function updateUI(t) {
  if (progEl) progEl.style.width = (Math.min(1, t / FILM_LEN) * 100).toFixed(2) + '%';
  if (dbgEl) dbgEl.textContent = `t=${t.toFixed(2)}  ${sceneState(t).A.name}  ${fpsShown.toFixed(0)} fps  ${W}x${H}`;
}

function start() {
  canvas = document.getElementById('film');
  gl = IJ.initGL(canvas);
  progComp = IJ.program(COMP_FS, null, 'comp');
  progBright = IJ.program(BRIGHT_FS, null, 'bright');
  progBlur = IJ.program(BLUR_FS, null, 'blur');
  progFinal = IJ.program(FINAL_FS, null, 'final');
  IJ.scenes.sort((a, b) => a.start - b.start);
  for (const s of IJ.scenes) if (s.init) s.init(gl);
  resize();
  window.addEventListener('resize', resize);

  barEl = document.getElementById('bar'); progEl = document.getElementById('prog');
  if (params.has('debug')) { dbgEl = document.getElementById('dbg'); dbgEl.style.display = 'block'; }

  const t0 = params.has('t') ? +params.get('t') : 0;
  filmTime = t0;
  renderFrame(t0);
  updateUI(t0);
  requestAnimationFrame(loop);

  const overlay = document.getElementById('overlay');
  const status = document.getElementById('status');
  const begin = () => {
    if (overlay.classList.contains('gone')) return;
    overlay.classList.add('gone');
    if (IJ.audio) IJ.audio.unlock();
    play(filmTime);
  };
  if (params.has('still') || params.has('export')) overlay.classList.add('gone');

  // Render the score offline (it's all synthesis), then enable the play button.
  const ready = () => { document.body.classList.add('ready'); status.textContent = 'sound on · click anywhere'; };
  if (IJ.audio && !params.has('mute')) {
    IJ.audio.render().then(() => { audioReady = true; ready(); })
      .catch(e => { console.warn('audio unavailable', e); ready(); });
  } else ready();

  overlay.addEventListener('click', () => { if (document.body.classList.contains('ready')) begin(); });
  canvas.addEventListener('click', () => {
    if (!overlay.classList.contains('gone')) return;
    if (filmTime >= FILM_LEN + 1.5) { seek(0); play(0); return; }
    playing ? pause() : play();
  });
  barEl.addEventListener('click', e => {
    const r = barEl.getBoundingClientRect();
    seek(((e.clientX - r.left) / r.width) * FILM_LEN);
    updateUI(filmTime);
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (!overlay.classList.contains('gone')) { if (document.body.classList.contains('ready')) begin(); return; } playing ? pause() : play(); }
    else if (e.code === 'ArrowRight') { seek(now() + 5); updateUI(filmTime); }
    else if (e.code === 'ArrowLeft') { seek(now() - 5); updateUI(filmTime); }
    else if (e.code === 'KeyR') { seek(0); if (!playing) play(0); }
    else if (e.code === 'KeyE' && IJ.exportToDownload && !IJ.exporting) {
      if (playing) pause();
      if (confirm('Export the film as an MP4 video? It renders every frame, so it takes a few minutes.')) IJ.exportToDownload();
    }
    else if (e.code === 'KeyF') { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}); }
  });
  let hideTimer = 0;
  window.addEventListener('mousemove', () => {
    document.body.classList.add('mouse');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.body.classList.remove('mouse'), 1800);
  });
}

IJ.film = { start, seek, play, pause, render: renderFrame, setSize(w, h) { forced = w ? [w, h] : null; resize(); }, get time() { return filmTime; }, get playing() { return playing; }, LENGTH: FILM_LEN, sceneState };
window.film = IJ.film;
window.addEventListener('DOMContentLoaded', () => {
  try { start(); }
  catch (e) {
    console.error(e);
    const s = document.getElementById('status');
    if (s) s.textContent = 'This film needs WebGL2 — ' + e.message;
  }
});
})();

</script>
