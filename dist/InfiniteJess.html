<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Jess</title>
<style>
  html, body { margin: 0; height: 100%; background: #050507; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Hoefler Text', 'Baskerville', Georgia, serif; color: #efe7da; }
  canvas#film { display: block; background: #000; cursor: pointer; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, #15161d 0%, #050507 70%); transition: opacity 1.2s ease; cursor: default; z-index: 3; }
  #overlay.gone { opacity: 0; pointer-events: none; }
  body.ready #overlay { cursor: pointer; }
  #overlay .for { font-style: italic; letter-spacing: .08em; opacity: .55; font-size: clamp(14px, 1.6vw, 20px); margin-bottom: 2.2em; }
  #overlay .play { width: 78px; height: 78px; border-radius: 50%; border: 1px solid rgba(239,231,218,.35); display: flex; align-items: center; justify-content: center;
    opacity: .25; transition: opacity .8s, transform .8s, border-color .8s; }
  body.ready #overlay .play { opacity: 1; }
  body.ready #overlay:hover .play { transform: scale(1.06); border-color: rgba(239,231,218,.8); }
  #overlay .play::after { content: ''; margin-left: 6px; border-style: solid; border-width: 13px 0 13px 22px; border-color: transparent transparent transparent #efe7da; }
  #status { margin-top: 1.8em; font-size: 13px; letter-spacing: .12em; text-transform: lowercase; opacity: .45; font-family: 'Avenir Next', 'Helvetica Neue', sans-serif; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 14px; cursor: pointer; opacity: 0; transition: opacity .6s; z-index: 2; }
  #bar::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.12); }
  #prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: rgba(255,236,210,.7); }
  body.mouse #bar, body:not(.playing) #bar { opacity: 1; }
  body:not(.playing) #bar { opacity: .5; }
  #dbg { display: none; position: fixed; left: 8px; top: 6px; font: 12px/1.3 ui-monospace, Menlo, monospace; color: #9f9; background: rgba(0,0,0,.55); padding: 3px 6px; z-index: 4; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="overlay">
  <div class="for">a film for Jess</div>
  <div class="play"></div>
  <div id="status">tuning the cartridge…</div>
</div>
<div id="bar"><div id="prog"></div></div>
<div id="dbg"></div>
<script>
// ---- js/core.js
// INFINITE JESS — core: WebGL2 plumbing, math, text, and shared renderers.
// Everything here is plain JS on the global IJ namespace so the film runs from file://.
(function () {
'use strict';
const IJ = (window.IJ = window.IJ || {});

// ------------------------------------------------------------------ math ---
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = {
  linear: t => t,
  inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
};
// Keyframes: frames = [[time, value], ...], value is a number or an array.
function key(t, frames, e = ease.sine) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 0; i < frames.length - 1; i++) {
    const [t0, v0] = frames[i], [t1, v1] = frames[i + 1];
    if (t < t1) {
      const u = e((t - t0) / (t1 - t0));
      return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], u)) : lerp(v0, v1, u);
    }
  }
  return frames[frames.length - 1][1];
}
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
Object.assign(IJ, { clamp, lerp, smooth, ease, key, rng });

// column-major 4x4 matrices
const M4 = {
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
      o[c * 4 + r] = s;
    }
    return o;
  },
  persp(fovy, aspect, n, f) {
    const t = 1 / Math.tan(fovy / 2), o = new Float32Array(16);
    o[0] = t / aspect; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f);
    return o;
  },
  lookAt(e, c, u = [0, 1, 0]) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2];
    let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx;
    l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
      -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
  },
  ortho2D(aspect) { // p-space (y in [-1,1], x in [-aspect,aspect]) -> clip
    const o = new Float32Array(16); o[0] = 1 / aspect; o[5] = 1; o[10] = 1; o[15] = 1; return o;
  },
};
IJ.M4 = M4;

// ----------------------------------------------------------- GLSL prelude ---
IJ.GLSL = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler3D;
uniform vec2 uRes;
uniform float uTime;
uniform float uLocal;
#define PI 3.14159265
#define TAU 6.2831853
float hash11(float p){ p = fract(p*.1031); p *= p+33.33; p *= p+p; return fract(p); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
vec3 hash33(vec3 p3){ p3 = fract(p3*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y); }
float gnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*f*(f*(f*6.-15.)+10.);
  vec2 ga=hash22(i)*2.-1., gb=hash22(i+vec2(1,0))*2.-1., gc=hash22(i+vec2(0,1))*2.-1., gd=hash22(i+vec2(1,1))*2.-1.;
  float a=dot(ga,f), b=dot(gb,f-vec2(1,0)), c=dot(gc,f-vec2(0,1)), d=dot(gd,f-vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y)*1.4; }
float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(1.7,9.2); a*=.5; } return s; }
float fbm3(vec2 p){ float a=.5, s=0.; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(1.7,9.2); a*=.5; } return s/.875; }
float gfbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*gnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(1.7,9.2); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
float sdCircle(vec2 p, float r){ return length(p)-r; }
float sdBox(vec2 p, vec2 b){ vec2 d=abs(p)-b; return length(max(d,0.))+min(max(d.x,d.y),0.); }
float sdRBox(vec2 p, vec2 b, float r){ return sdBox(p, b-r)-r; }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float sdCapsule(vec2 p, vec2 a, vec2 b, float ra, float rb){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-mix(ra,rb,h); }
float sdEllipse(vec2 p, vec2 ab){ float k0=length(p/ab), k1=length(p/(ab*ab)); return k0*(k0-1.)/max(k1,1e-5); }
float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float smax(float a, float b, float k){ return -smin(-a,-b,k); }
float sdHeart(vec2 p){ p.x=abs(p.x);
  if(p.y+p.x>1.) return sqrt(dot(p-vec2(.25,.75),p-vec2(.25,.75)))-sqrt(2.)/4.;
  return sqrt(min(dot(p-vec2(0,1),p-vec2(0,1)), dot(p-.5*max(p.x+p.y,0.),p-.5*max(p.x+p.y,0.))))*sign(p.x-p.y); }
float sdBezier(vec2 pos, vec2 A, vec2 B, vec2 C){
  vec2 a=B-A, b=A-2.*B+C, c=a*2., d=A-pos;
  float kk=1./max(dot(b,b),1e-6), kx=kk*dot(a,b), ky=kk*(2.*dot(a,a)+dot(d,b))/3., kz=kk*dot(d,a);
  float res=0., p=ky-kx*kx, p3=p*p*p, q=kx*(2.*kx*kx-3.*ky)+kz, h=q*q+4.*p3;
  if(h>=0.){ h=sqrt(h); vec2 x=(vec2(h,-h)-q)/2.; vec2 uv=sign(x)*pow(abs(x),vec2(1./3.)); float t=clamp(uv.x+uv.y-kx,0.,1.); vec2 q2=d+(c+b*t)*t; res=dot(q2,q2); }
  else { float z=sqrt(-p), v=acos(q/(p*z*2.))/3., m=cos(v), n=sin(v)*1.732050808; vec3 t=clamp(vec3(m+m,-n-m,n-m)*z-kx,0.,1.);
    vec2 q1=d+(c+b*t.x)*t.x; vec2 q2=d+(c+b*t.y)*t.y; res=min(dot(q1,q1),dot(q2,q2)); }
  return sqrt(res); }
float fillAA(float d, float aa){ return 1.-smoothstep(-aa, aa, d); }
vec3 hsv2rgb(vec3 c){ vec3 p=abs(fract(c.xxx+vec3(0,2,1)/3.)*6.-3.); return c.z*mix(vec3(1),clamp(p-1.,0.,1.),c.y); }
float luma(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
float easeIO(float t){ t=clamp(t,0.,1.); return t<.5 ? 4.*t*t*t : 1.-pow(-2.*t+2.,3.)/2.; }
float sat(float x){ return clamp(x,0.,1.); }
`;

IJ.VS_FULL = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv = p; gl_Position = vec4(p*2.-1., 0., 1.); }`;

// ------------------------------------------------------------- GL setup ---
IJ.initGL = function (canvas) {
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: true, premultipliedAlpha: false, preserveDrawingBuffer: /[?&](debug|export)/.test(location.search), powerPreference: 'high-performance' });
  if (!gl) throw new Error('WebGL2 is not available in this browser.');
  IJ.gl = gl;
  IJ.floatRT = !!gl.getExtension('EXT_color_buffer_float');
  gl.getExtension('OES_texture_float_linear');
  IJ.emptyVAO = gl.createVertexArray();
  return gl;
};

function compile(gl, type, src, label) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    const lines = src.split('\n');
    const m = /ERROR: \d+:(\d+)/.exec(log);
    const ln = m ? +m[1] : 0;
    const ctx = lines.slice(Math.max(0, ln - 4), ln + 2).map((l, i) => (Math.max(0, ln - 4) + i + 1) + ': ' + l).join('\n');
    console.error(`[${label}] shader compile error\n${log}\n${ctx}`);
    throw new Error(`Shader compile failed: ${label}`);
  }
  return s;
}

// Program with automatic uniform dispatch: prog.set({uName: value, ...}).
IJ.program = function (fsBody, vsSrc, label = 'prog') {
  const gl = IJ.gl;
  const vs = compile(gl, gl.VERTEX_SHADER, vsSrc || IJ.VS_FULL, label + '.vs');
  const fsSrc = fsBody.startsWith('#version') ? fsBody : IJ.GLSL + fsBody;
  const fs = compile(gl, gl.FRAGMENT_SHADER, fsSrc, label + '.fs');
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(`[${label}] link error`, gl.getProgramInfoLog(p));
    throw new Error('Program link failed: ' + label);
  }
  const uniforms = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    uniforms[name] = { loc: gl.getUniformLocation(p, info.name), type: info.type, size: info.size };
  }
  let unit = 0;
  const prog = {
    p, uniforms, label,
    use() { gl.useProgram(p); unit = 0; return prog; },
    set(obj) {
      for (const k in obj) {
        const u = uniforms[k]; if (!u) continue;
        const v = obj[k], l = u.loc;
        switch (u.type) {
          case gl.FLOAT: u.size > 1 ? gl.uniform1fv(l, v) : gl.uniform1f(l, v); break;
          case gl.FLOAT_VEC2: gl.uniform2fv(l, v); break;
          case gl.FLOAT_VEC3: gl.uniform3fv(l, v); break;
          case gl.FLOAT_VEC4: gl.uniform4fv(l, v); break;
          case gl.INT: case gl.BOOL: u.size > 1 ? gl.uniform1iv(l, v) : gl.uniform1i(l, v); break;
          case gl.FLOAT_MAT2: gl.uniformMatrix2fv(l, false, v); break;
          case gl.FLOAT_MAT3: gl.uniformMatrix3fv(l, false, v); break;
          case gl.FLOAT_MAT4: gl.uniformMatrix4fv(l, false, v); break;
          case gl.SAMPLER_2D: case gl.SAMPLER_3D: {
            const is3D = u.type === gl.SAMPLER_3D;
            gl.activeTexture(gl.TEXTURE0 + unit);
            gl.bindTexture(is3D ? gl.TEXTURE_3D : gl.TEXTURE_2D, v);
            gl.uniform1i(l, unit++);
            break;
          }
        }
      }
      return prog;
    },
    // Full-screen pass with the standard uniforms.
    draw(obj) {
      prog.use();
      prog.set({ uRes: [IJ.curW, IJ.curH], uTime: IJ.time || 0 });
      if (obj) prog.set(obj);
      gl.bindVertexArray(IJ.emptyVAO);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      return prog;
    },
  };
  return prog;
};

// Render targets. IJ.curW/curH track the bound target's size.
IJ.fbo = function (w, h, opts = {}) {
  const gl = IJ.gl;
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  const hdr = opts.float !== false && IJ.floatRT;
  gl.texImage2D(gl.TEXTURE_2D, 0, hdr ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, hdr ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  const filt = opts.nearest ? gl.NEAREST : gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  let depth = null;
  if (opts.depth) {
    depth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {
    fb, tex, w, h, depth,
    bind() { gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.viewport(0, 0, w, h); IJ.curW = w; IJ.curH = h; },
    dispose() { gl.deleteFramebuffer(fb); gl.deleteTexture(tex); if (depth) gl.deleteRenderbuffer(depth); },
  };
};

IJ.blend = function (mode) {
  const gl = IJ.gl;
  if (!mode) { gl.disable(gl.BLEND); return; }
  gl.enable(gl.BLEND);
  if (mode === 'add') gl.blendFunc(gl.ONE, gl.ONE);
  else if (mode === 'premult') gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  else if (mode === 'multiply') gl.blendFunc(gl.DST_COLOR, gl.ONE_MINUS_SRC_ALPHA);
  else if (mode === 'screen') gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
};

// Scene-wide helpers for p-space: y in [-1,1], x in [-aspect, aspect].
IJ.aspect = () => IJ.curW / IJ.curH;

// -------------------------------------------------------------- text -------
// Rasterize text with the system's own fonts (no font files) into a texture.
IJ.FONTS = {
  serif: "'Hoefler Text', 'Baskerville', 'Garamond', 'Georgia', 'Times New Roman', serif",
  display: "'Didot', 'Bodoni 72', 'Hoefler Text', 'Baskerville', 'Georgia', serif",
  mono: "'American Typewriter', 'Courier New', 'Courier', monospace",
  chalk: "'Chalkduster', 'Chalkboard SE', 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive",
  hand: "'Bradley Hand', 'Noteworthy', 'Segoe Print', 'Comic Sans MS', cursive",
  script: "'Snell Roundhand', 'Savoye LET', 'Brush Script MT', 'Segoe Script', cursive",
  sans: "'Avenir Next', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif",
};
IJ.text = function (str, o = {}) {
  const gl = IJ.gl;
  const size = o.size || 128;
  const font = `${o.italic ? 'italic ' : ''}${o.weight || 400} ${size}px ${IJ.FONTS[o.font] || o.font || IJ.FONTS.serif}`;
  const lines = String(str).split('\n');
  const c = document.createElement('canvas');
  const x = c.getContext('2d');
  x.font = font;
  const ls = (o.spacing || 0) * size;
  const measure = s => {
    if (!ls) return x.measureText(s).width;
    let w = 0; for (const ch of s) w += x.measureText(ch).width; return w + ls * Math.max(0, [...s].length - 1);
  };
  const widths = lines.map(measure);
  const lh = (o.lineHeight || 1.25) * size;
  const pad = Math.ceil(size * (o.pad != null ? o.pad : 0.3));
  c.width = Math.ceil(Math.max(...widths) + pad * 2);
  c.height = Math.ceil(lh * lines.length + pad * 2);
  x.font = font;
  x.fillStyle = o.color || '#fff';
  x.textBaseline = 'alphabetic';
  lines.forEach((line, i) => {
    const w = widths[i];
    let px = pad;
    if (o.align === 'center') px = (c.width - w) / 2;
    else if (o.align === 'right') px = c.width - pad - w;
    const py = pad + lh * i + size * 0.95;
    if (!ls) x.fillText(line, px, py);
    else for (const ch of line) { x.fillText(ch, px, py); px += x.measureText(ch).width + ls; }
  });
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return { tex, w: c.width, h: c.height, aspect: c.width / c.height, canvas: c };
};

// Textured quad in p-space with tint, alpha, mip blur and a left-to-right wipe.
let spriteProg = null;
IJ.sprite = function (t, o) {
  const gl = IJ.gl;
  if (!spriteProg) {
    spriteProg = IJ.program(`
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec4 uTint; uniform float uBias; uniform vec2 uWipe;
void main(){
  vec4 c = texture(uTex, vUv, uBias);
  float m = uWipe.y > 0. ? clamp((uWipe.x*(1.+uWipe.y) - vUv.x)/uWipe.y, 0., 1.) : 1.;
  o = c * uTint * m;
}`, `#version 300 es

  }

  // --- 39–48 s: the adventure cat. Pizzicato oom-pah, a flop, a mrrp, the zoomies.
  {
    const plan = [[13, 0, CH.D], [13, 2, CH.D], [14, 0, CH.G], [14, 2, CH.A7], [15, 0, CH.D], [15, 2, CH.A7]];
    for (const [bar, beat, ch] of plan) {
      const root = ch[0] > 40 ? ch[0] - 12 : ch[0];
      for (let k = 0; k < 2; k++) {
        const tt = T(bar, beat + k);
        if (Math.abs(tt - CUES.catFlop - 0.35) < 0.5) continue; // comic pause for the flop
        pizz(tt, k === 0 ? root + 12 : root + 19, 0.8, B.pizz);
        const u = upper(ch, 62).slice(0, 3);
        u.forEach(m => pizz(tt + BEAT / 2, m, 0.35, B.pizz));
      }
    }
    // walking theme on marimba
    melody(13, [['D5', 0.5, 0.6], ['F#5', 0.5, 0.55], ['A5', 0.5, 0.6], ['F#5', 0.5, 0.5], ['D6', 1, 0.65]], (t, m, d, v) => marimba(t, m, v, B.mar));
    // the flop: a slide-whistle droop, a thump, then a put-upon mrrp
    slide(CUES.catFlop - 0.35, 1100, 380, 0.55, 0.06, B.fx);
    boom(CUES.catFlop + 0.2, 0.18, B.fx);
    mrrp(CUES.catMrrp, 1.0, 0.42, 0.35, B.fx);
    melody(14, [[null, 2], ['C#6', 0.5, 0.55], ['A5', 0.5, 0.5], ['E5', 1, 0.5]], (t, m, d, v) => marimba(t, m, v, B.mar));
    // Yuffie: the zap, then the zoomies, back and forth
    blip(CUES.yuffieZap, 2200, 1.4, B.fx, 0.08);
    shimmer(CUES.yuffieZap, 0.25, 6, 0.6, B.cel, 88, 104);
    const zs = [CUES.zoomies, CUES.zoomies + 0.42, CUES.zoomies + 0.84, CUES.zoomies + 1.2];
    zs.forEach((z, i) => whoosh(z, 0.34, 700, 3600, 0.22, B.fxDry, i % 2 ? 0.8 : -0.8, i % 2 ? -0.8 : 0.8));
    for (let i = 0; i < 14; i++) tap(CUES.zoomies + i * 0.1, 0.35, B.fxDry, 1800);
    // the head-bump: Uriel is the affectionate one
    mrrp(CUES.headbump, 1.18, 0.3, 0.3, B.fx);
    melody(15, [['F#5', 0.5, 0.6], ['A5', 0.5, 0.6], ['D6', 1, 0.7], ['A5', 0.5, 0.5], ['C#6', 0.5, 0.5], ['E6', 1, 0.6]], (t, m, d, v) => marimba(t, m, v, B.mar));
  }

  // --- 48–57 s: Alice & Bob on the lattice. Arpeggiator, blips, crunch, decrypt, heart.
  {
    crunch(47.7, 0.5, 1, B.fxDry);
    const bars = [[16, CH.Bm], [17, CH.G], [18, CH.Asus4]];
    for (const [bar, ch] of bars) {
      chordPad(bar, ch, 4, 0.9, { cut: 1800 });
      const u = upper(ch, 57), pat = [0, 1, 2, 3, 4, 3, 2, 1, 0, 2, 4, 2, 1, 3, 4, 3];
      for (let i = 0; i < 16; i++) {
        let m = u[pat[i] % u.length] + (i % 8 === 7 ? 12 : 0);
        if (bar === 18 && i >= 8) { const ua = upper(CH.A, 57); m = ua[pat[i] % ua.length] + (i % 8 === 7 ? 12 : 0); }

    crunch(CUES.encrypt, 0.6, 0.9, B.fx);
    for (let i = 0; i < 12; i++) blip(CUES.encrypt + 0.6 + i * 0.12, 1500 + R() * 2000, 0.5, B.fx);
    // decrypt: a falling cascade of snaps
    for (let i = 0; i < 16; i++) blip(CUES.decrypt + i * 0.07, 3200 - i * 140, 0.8, B.fx, 0.03);
    shimmer(CUES.heartForm, 1.2, 12, 0.5, B.cel, 86, 100);
    melody(18, [['F#5', 0.5, 0.7], ['A5', 0.5, 0.7], ['D6', 1, 0.8], ['C#6', 0.5, 0.7], ['B5', 0.5, 0.65], ['A5', 1, 0.7]], (t, m, d, v) => lead(t, m, d * 0.9, v, B.lead));

  {
    const bars = [[19, CH.D], [20, CH.AC], [21, CH.Bm7], [22, CH.Gmaj7]];
    for (const [bar, ch] of bars) {
      chordPad(bar, ch, 4, 0.7, { cut: 1100 });
      bass(T(bar), ch[0] > 40 ? ch[0] - 12 : ch[0], 4 * BEAT, 0.4, B.bass);
      const u = upper(ch, 62);
      for (let i = 0; i < 8; i++) marimba(T(bar, i * 0.5), u[[0, 2, 1, 3, 2, 4, 3, 1][i] % u.length], 0.32, B.mar);
    }
    scratch(CUES.chalkAxes, 0.35, 1, B.fxDry); scratch(CUES.chalkAxes + 0.45, 0.35, 1, B.fxDry);
    scratch(CUES.chalkAxes + 0.9, 0.3, 0.9, B.fxDry); scratch(CUES.chalkAxes + 1.25, 0.3, 0.9, B.fxDry);
    for (let i = 0; i < 26; i++) tap(CUES.chalkDots + i * 0.085 + R() * 0.03, 0.6, B.fxDry);
    for (let i = 0; i < 9; i++) tap(CUES.dieRoll + i * (0.05 + i * 0.012), 0.8 - i * 0.06, B.fxDry, 1400);
    for (let k = 0; k < 4; k++) scratch(CUES.learn + k * 0.95, 0.8, 0.7, B.fxDry);
    whoosh(CUES.merge - 0.3, 0.8, 500, 1800, 0.08, B.fx);
    [n('D6'), n('F#6'), n('A6'), n('D7')].forEach((m, i) => bell(CUES.bell + i * 0.06, m, 0.45, B.bell, 3));
    melody(22, [[null, 2], ['A5', 0.5, 0.5], ['B5', 0.5, 0.5], ['C#6', 1, 0.55]], (t, m, d, v) => marimba(t, m, v, B.mar));
  }

  // --- 69–81 s: dusk, watercolor. The full theme: strings, piano, bass.
  {
    whoosh(CUES.duskWash - 0.4, 1.8, 300, 1500, 0.08, B.fx);
    const bars = [[23, CH.D], [24, CH.Fsm7], [25, CH.Bm7], [26, CH.Gmaj7]];
    for (const [bar, ch] of bars) {
      ch.forEach(m => pad(T(bar), m, 4 * BEAT, 0.9, B.str, { att: 0.9, rel: 1.6, cut: 2200, vib: true }));
      chordPad(bar, ch, 4, 0.6, { cut: 1000 });
      bass(T(bar), ch[0] > 40 ? ch[0] - 12 : ch[0], 3 * BEAT, 0.5, B.bass);
      bass(T(bar, 3), (ch[0] > 40 ? ch[0] - 12 : ch[0]) + 7, BEAT, 0.4, B.bass);
      const u = upper(ch, 55);
      for (let i = 0; i < 8; i++) epiano(T(bar, i * 0.5), u[[0, 2, 4, 2, 1, 3, 4, 3][i] % u.length], 0.5, 0.22, B.ep);
    }
    const mel = (bar, notes) => melody(bar, notes, (t, m, d, v) => { epiano(t, m, d, v, B.ep); epiano(t, m + 12, d, v * 0.35, B.ep); });
    mel(23, [['F#5', 1, 0.75], ['A5', 0.5, 0.7], ['D6', 1.5, 0.8], ['C#6', 0.5, 0.65], ['B5', 0.5, 0.6]]);
    mel(24, [['A5', 2, 0.7], ['F#5', 1, 0.6], ['E5', 1, 0.55]]);
    mel(25, [['F#5', 1, 0.7], ['A5', 0.5, 0.65], ['D6', 1.5, 0.8], ['E6', 0.5, 0.7], ['D6', 0.5, 0.65]]);
    mel(26, [['B5', 2, 0.7], ['A5', 1, 0.6], ['F#5', 1, 0.55]]);
    shimmer(CUES.treesGrow, 3.5, 10, 0.25, B.cel, 79, 98);
    shimmer(CUES.blossom, 2.5, 26, 0.45, B.cel, 81, 102);
  }

  // --- 81–90 s: finale. Em9 – A7sus4 – D. The motif, slowly, on piano and bells.
  {
    whoosh(CUES.ribbonInf - 0.2, 2.2, 400, 2600, 0.07, B.fx, -0.5, 0.5);
    const bars = [[27, CH.Em9], [28, CH.A7], [29, CH.Dadd9]];
    for (const [bar, ch] of bars) {
      const len = bar === 29 ? 7 : 4;
      ch.forEach(m => pad(T(bar), m, len * BEAT, 1.0, B.str, { att: 0.7, rel: 3, cut: 2400, vib: true }));
      chordPad(bar, ch, len, 0.8, { cut: 1400, rel: 3.5 });
      bass(T(bar), ch[0] > 40 ? ch[0] - 12 : ch[0], len * BEAT, 0.5, B.bass);
    }
    const fin = [[27, [['F#5', 1, 0.7], ['A5', 1, 0.7], ['D6', 2, 0.8]]], [28, [['C#6', 1, 0.7], ['B5', 1, 0.65], ['A5', 2, 0.7]]], [29, [['D6', 4, 0.8]]]];
    for (const [bar, notes] of fin) melody(bar, notes, (t, m, d, v) => { epiano(t, m, d, v, B.ep); bell(t, m, v * 0.6, B.bell, 3); });
    shimmer(CUES.ribbonJess, 2.8, 22, 0.35, B.cel, 86, 104);
    [n('D5'), n('F#5'), n('A5'), n('D6'), n('E6'), n('A6')].forEach((m, i) => bell(CUES.signoff + i * 0.09, m, 0.4, B.bell, 4.5));
    // the end card, typed: a key for every character, a little bell and a return at each line
    const E = CUES.endnote;
    let tt = E.start;
    E.lines.forEach(line => {
      for (let i = 0; i < line.length; i++) {
        if (line[i] !== ' ') tap(tt + i / E.cps + (R() - 0.5) * 0.006, 0.55 + 0.25 * R(), B.fxDry, 2200 + R() * 900);
      }
      tt += line.length / E.cps;
      chime(tt - 0.05, n('A6'), 0.25, B.fxDry, [[1, 1, 0.4], [2.76, 0.3, 0.15]]);
      noiseHit(tt + 0.02, 0.22, { f0: 900, f1: 2400, q: 2, gain: 0.05, swell: true, rel: 0.05 }, B.fxDry);
      tt += E.gap;
    });
  }
}

// ------------------------------------------------------------- transport ---
// The score is rendered in scene-aligned chunks (each with a tail for reverb and
// releases), so playback can begin as soon as the first chunk exists while the rest
// render in parallel. At playback the chunks overlap-add into one compressor.
const CHUNKS = [[0, 12], [12, 27], [27, 39], [39, 48], [48, 57], [57, 69], [69, 81], [81, 95]];
const TAIL = 5;
const chunks = CHUNKS.map(([a, b]) => ({ a, b, buf: null }));
let actx = null, bus = null, sources = [], startAt = 0, isPlaying = false;

function renderChunk(c) {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const len = Math.min(LEN, c.b + TAIL) - c.a;
  const ctx = new OAC(2, Math.ceil(SR * len), SR);
  buildScore(ctx, c.a, c.b);
  return ctx.startRendering().then(b => { c.buf = b; if (isPlaying) scheduleChunk(c); return b; });
}
function scheduleChunk(c) {
  if (!actx || !c.buf) return;
  const at = startAt + c.a;                      // context time where this chunk's t=0 sounds
  const off = Math.max(0, actx.currentTime + 0.02 - at);
  if (off >= c.buf.duration) return;
  const s = actx.createBufferSource();
  s.buffer = c.buf; s.connect(bus);
  s.start(at + off, off);
  sources.push(s);
}

IJ.audio = {
  // Resolves when the first chunk is ready; IJ.audio.all resolves when every chunk is.
  render() {
    const t0 = performance.now();
    let first;
    try { first = renderChunk(chunks[0]); } catch (e) { return Promise.reject(e); }
    this.all = first.then(() => Promise.all(chunks.slice(1).map(renderChunk))).then(() => { this.renderMs = performance.now() - t0; });
    return first.then(() => { this.firstMs = performance.now() - t0; });
  },
  unlock() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.008; comp.release.value = 0.3;
      bus = actx.createGain(); bus.gain.value = 1;
      const out = actx.createGain(); out.gain.value = 1.45;
      bus.connect(comp); comp.connect(out); out.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  },
  play(offset) {
    this.unlock();
    this.stop();
    startAt = actx.currentTime + 0.05 - offset;
    isPlaying = true;
    for (const c of chunks) scheduleChunk(c);
  },
  stop() {
    for (const s of sources) { try { s.stop(); } catch (e) { /* not started */ } s.disconnect(); }
    sources = []; isPlaying = false;
  },
  time() { return actx ? actx.currentTime - startAt - (actx.outputLatency || 0) : 0; },
  playing() { return isPlaying && this.time() < LEN - 0.1; },
  duration() { return LEN; },
  // For offline inspection: all chunks summed into [left, right].
  mixdown() {
    const L = new Float32Array(SR * LEN), Rr = new Float32Array(SR * LEN);
    for (const c of chunks) if (c.buf) {
      const o = Math.round(c.a * SR), l = c.buf.getChannelData(0), r = c.buf.getChannelData(1);
      for (let i = 0; i < l.length && o + i < L.length; i++) { L[o + i] += l[i]; Rr[o + i] += r[i]; }
    }
    return [L, Rr];
  },
  SR,
};
})();

<script>
// ---- js/scenes/01_crt.js
// 0–6 s · A cartridge tunes in. Curved CRT glass, scanlines, snow, a rolling picture,
// then SUBSIDIZED TIME / YEAR OF GLAD, and a push through the glass into the sky.
(function () {
const IJ = window.IJ;
const C = IJ.CUES;

const FS = `
in vec2 vUv; out vec4 o;
uniform sampler2D uT1, uT2; uniform vec2 uA;   // text textures, their aspects
uniform float uOn, uStatic, uRoll, uCard, uZoom, uGlow, uJit, uT;

const vec2 S = vec2(1.22, .915);             // screen half-size in p-space (4:3)

vec3 sky(vec2 uv){
  vec3 c = mix(vec3(.6,.72,.84), vec3(.17,.34,.62), smoothstep(.0, 1., uv.y));
  float n = fbm(uv*vec2(3.,5.) + vec2(uT*.05, 0.));
  float cl = smoothstep(.55, .85, n + .3*(1.-uv.y) - .28);
  return mix(c, vec3(.9,.92,.93), cl*.45);
}
float textAt(sampler2D t, float aspect, vec2 uv, vec2 c, float w){
  vec2 sz = vec2(w, w/aspect*(S.x/S.y));
  vec2 tuv = (uv - c)/sz + .5;
  if (any(lessThan(tuv, vec2(0))) || any(greaterThan(tuv, vec2(1)))) return 0.;
  return texture(t, vec2(tuv.x, 1.-tuv.y)).a;
}
vec3 card(vec2 uv){
  vec3 c = sky(uv);
  float a1 = textAt(uT1, uA.x, uv, vec2(.5,.63), .42);
  float a2 = textAt(uT2, uA.y, uv, vec2(.5,.47), .78);
  // thin rules around the title
  float rule = (1.-smoothstep(.0015,.003, abs(uv.y-.555)))*step(abs(uv.x-.5), .3)
             + (1.-smoothstep(.0015,.003, abs(uv.y-.375)))*step(abs(uv.x-.5), .3);
  float sh = textAt(uT2, uA.y, uv + vec2(-.004,.006), vec2(.5,.47), .78);
  c = mix(c, c*.45, sh*.75);
  c = mix(c, vec3(1.,.98,.93), max(max(a1*.9, a2), rule*.8));
  return c;
}
vec3 snow(vec2 uv){
  float n = hash12(floor(uv*vec2(360.,270.)) + floor(uT*40.)*vec2(13.1,7.7));
  float streak = hash11(floor(uv.y*270.) + floor(uT*40.)*3.1);
  float bar = .75 + .25*sin((uv.y + uT*.9)*9.);
  return vec3(mix(n, streak, .25)*bar);
}
vec3 tube(vec2 uv){
  // vertical hold slipping: roll the picture with a blanking bar
  float y = uv.y + uRoll;
  float blank = smoothstep(.0,.02, fract(y)) * smoothstep(1.,.97, fract(y));
  vec2 u = vec2(uv.x, fract(y));
  u.x += (hash11(floor(u.y*270.) + floor(uT*60.)) - .5) * .004 * uJit;
  vec3 c = uCard > 0. ? card(u) * uCard : vec3(0.);
  c = mix(c, snow(u), uStatic);
  return c * (uRoll != 0. ? blank : 1.);
}
void main(){
  vec2 p = (2.*gl_FragCoord.xy - uRes)/uRes.y;
  p /= uZoom;
  vec2 q = p / S;
  vec2 q2 = q * (1. + .07*dot(q,q));           // bulging glass
  float scr = sdRBox(q2, vec2(1.), .16);
  float px = 2./uRes.y/uZoom/S.y;
  vec3 col = vec3(0.);
  vec2 uv = q2*.5 + .5;
  float bright = 0.;
  if (scr < px*2.) {
    // power-on: a line that opens into a picture
    float open = uOn;
    float band = mix(.004, 1.05, open);
    float bandMask = 1. - smoothstep(band - .01, band, abs(q2.y));
    float hMask = 1. - smoothstep(mix(.15, 1.05, smoothstep(0., .25, open)), mix(.16,1.06,smoothstep(0.,.25,open)), abs(q2.x));
    float boost = 1. + 2.5*(1.-smoothstep(0., .6, open));
    // chromatic misconvergence
    float ab = .003 + .006*uStatic;
    vec3 c;
    c.r = tube(uv + vec2(ab, 0.)).r;
    c.g = tube(uv).g;
    c.b = tube(uv - vec2(ab, 0.)).b;
    if (open < 1.) c = mix(vec3(.85,.9,1.), c, smoothstep(.3, .9, open));
    c *= bandMask * hMask * boost * step(.0001, open);
    // scanlines and aperture grille
    float lines = 260.;
    c *= .62 + .38*pow(abs(sin(uv.y*lines*PI)), .8);
    float m = mod(gl_FragCoord.x, 3.);
    vec3 grille = vec3(m < 1. ? 1. : .78, (m >= 1. && m < 2.) ? 1. : .78, m >= 2. ? 1. : .78);
    c *= mix(vec3(1.), grille, .5/max(1., uZoom*.5));
    // flicker + edge darkening of the tube
    c *= .96 + .04*sin(uT*113.);
    c *= smoothstep(1.25, .45, length(q2*vec2(.9,1.)));
    bright = luma(c);
    // dark glass when off, a soft window reflection always
    vec3 glass = vec3(.028,.032,.035) + .03*smoothstep(.9, -.6, q2.x + q2.y*1.3);
    glass += .035*smoothstep(.04, .0, abs(q2.x + q2.y*.6 + .35))*smoothstep(1.,.2,length(q2));
    col = glass + c;
    col *= 1. - smoothstep(-px*2., px*2., scr);
  }
  // bezel and the room
  float bez = sdRBox(p, S*vec2(1.12,1.14) + vec2(.08), .22);
  if (scr > -px*2.) {
    vec3 plastic = mix(vec3(.05,.045,.04), vec3(.085,.075,.065), smoothstep(-1., 1., p.y));
    float rim = smoothstep(.03, 0., abs(scr - .01));
    plastic += rim*.05;
    float inner = smoothstep(.0, .09, scr);                  // inner shadow near the glass
    plastic *= .55 + .45*inner;
    vec3 room = vec3(.012,.011,.012) * (1. - .4*length(p)/2.);
    vec3 outside = mix(plastic, room, smoothstep(-.005, .005, bez));
    // light spill from the picture
    outside += vec3(.35,.45,.6) * uOn * (.35 + .65*uCard) * .12 * exp(-max(scr,0.)*2.5) * (1.-uStatic*.4);
    col = mix(col, outside, smoothstep(-px*2., px*2., scr));
  }
  col = mix(col, vec3(1.,.99,.96)*1.3, uGlow);
  o = vec4(col, 1.);
}`;

IJ.registerScene({
  name: 'crt', start: 0, end: 6,
  post: { bloom: 0.5, grain: 0.05, vignette: 0.5, thresh: 0.7 },
  init() {
    this.p = IJ.program(FS, null, 'crt');
    this.t1 = IJ.text('SUBSIDIZED  TIME', { font: 'sans', size: 64, weight: 500, spacing: 0.32 });
    this.t2 = IJ.text('Year of Glad', { font: 'display', size: 170, italic: true });
  },
  render(t) {
    const on = IJ.ease.out(IJ.clamp((t - C.crtOn) / 0.45));
    let stat = IJ.smooth(C.staticStart - 0.1, C.staticStart + 0.05, t) * (1 - IJ.smooth(C.tune + 0.25, C.card, t));
    stat = Math.max(stat, t > C.card ? 0.05 * (1 - IJ.smooth(C.card, C.card + 1.2, t)) : 0);
    if (t < C.staticStart - 0.1 && on > 0) stat = 0.35;
    let roll = 0;
    if (t > C.tune && t < C.card) { const k = (C.card - t) / (C.card - C.tune); roll = -(k * k * 2.6) % 1; }
    const card = t > C.tune ? 1 : 0;
    const zoom = 1 + 9 * Math.pow(IJ.clamp((t - C.push) / (6.0 - C.push)), 2.6);
    const glow = IJ.smooth(5.55, 6.0, t);
    this.p.draw({
      uT1: this.t1.tex, uT2: this.t2.tex, uA: [this.t1.aspect, this.t2.aspect],
      uOn: on, uStatic: stat, uRoll: roll, uCard: card, uZoom: zoom, uGlow: glow,
      uJit: 0.3 + stat * 2, uT: t,
    });
  },
});
})();

</script>
<script>
// ---- js/scenes/02_sky.js
// 6–15 s · Through the glass and up through the clouds (a nod to the blue-sky
// first-edition cover). Raymarched volumetric cumulus from a JS-built 3D noise texture.
// Title: INFINITE JESS, an entertainment¹.
(function () {
const IJ = window.IJ;
const C = IJ.CUES;

const CLOUD_FS = `
in vec2 vUv; out vec4 o;
uniform sampler3D uNoise;
uniform vec3 uCam; uniform mat3 uRot; uniform vec3 uSun; uniform float uT, uExpo, uWarm;
const float CB = 0., CT = 1.7;

float remap(float x, float a, float b, float c, float d){ return c + (x-a)/(b-a)*(d-c); }
float dens(vec3 p){
  float h = (p.y - CB)/(CT - CB);
  if (h <= 0. || h >= 1.) return 0.;
  float prof = smoothstep(0., .1, h) * smoothstep(1., .3, h);
  vec3 q = p*vec3(.075,.1,.075) + vec3(uT*.004, 0., -uT*.002);
  vec4 n = texture(uNoise, q);
  float base = n.a*.62 + n.r*.38;
  float d = sat(remap(base*mix(.7, 1., prof) - (1.-prof)*.35, .46, 1., 0., 1.));
  if (d <= 0.) return 0.;
  vec4 m = texture(uNoise, q*5.1 + vec3(uT*.008, 0., 0.));
  d = sat(d - (m.g*.55 + m.b*.45)*.32*(1.-d*.8));
  return d*4.2;
}
float hg(float c, float g){ float g2 = g*g; return (1.-g2)/(4.*PI*pow(1.+g2-2.*g*c, 1.5)); }
vec3 skyCol(vec3 rd){
  float y = max(rd.y, 0.);
  vec3 zen = mix(vec3(.11,.3,.7), vec3(.3,.42,.7), uWarm);
  vec3 hor = mix(vec3(.72,.84,.95), vec3(1.,.8,.6), uWarm);
  vec3 c = mix(hor, zen, pow(y, .55));
  float s = max(dot(rd, uSun), 0.);
  c += vec3(1.,.9,.75)*(pow(s, 900.)*6. + pow(s, 24.)*.35 + pow(s, 4.)*.12*(1.+uWarm*2.));
  if (rd.y < 0.) c = mix(hor*.95, mix(vec3(.36,.5,.68), vec3(.6,.5,.52), uWarm), sat(-rd.y*2.5)); // haze over the sea below
  return c;
}
void main(){
  vec2 p = (2.*gl_FragCoord.xy - uRes)/uRes.y;
  vec3 rd = normalize(uRot * vec3(p, -1.9));
  vec3 ro = uCam;
  vec3 sky = skyCol(rd);
  // slab intersection
  float t0 = 0., t1 = 60.;
  if (abs(rd.y) > 1e-4) {
    float ta = (CB-ro.y)/rd.y, tb = (CT-ro.y)/rd.y;
    t0 = max(min(ta,tb), 0.); t1 = min(max(ta,tb), 60.);
  } else if (ro.y < CB || ro.y > CT) t1 = -1.;
  vec3 col = vec3(0.); float T = 1.; float tHit = 60.;
  if (t1 > t0) {
    float cosA = dot(rd, uSun);
    float phase = mix(hg(cosA, .65), hg(cosA, -.15), .35)*4.*PI*.5 + .35;
    vec3 sunC = mix(vec3(1.,.97,.92), vec3(1.,.78,.55), uWarm)*1.35;
    vec3 amb = mix(vec3(.55,.66,.82), vec3(.7,.62,.62), uWarm);
    float t = t0;
    float dt = .09;
    t += dt*hash12(gl_FragCoord.xy + fract(uT)*91.);
    for (int i = 0; i < 90; i++) {
      if (t > t1 || T < .015) break;
      vec3 pos = ro + rd*t;
      float d = dens(pos);
      if (d > .005) {
        if (tHit > 59.) tHit = t;
        float ld = dens(pos + uSun*.18) + dens(pos + uSun*.45) + dens(pos + uSun*.9)*.8;
        float sh = exp(-ld*.42);
        float h = (pos.y - CB)/(CT - CB);
        float powder = 1. - exp(-d*1.6);
        vec3 L = sunC*sh*phase*(.35 + .65*powder) + amb*(.45 + .6*h);
        float a = 1. - exp(-d*dt*1.6);
        col += T*a*L;
        T *= 1. - a;
        dt = .07 + t*.012;
      } else dt = .16 + t*.02;
      t += dt;
    }
  }
  vec3 c = col + T*sky;
  // aerial perspective
  float fog = 1. - exp(-max(tHit - 2., 0.)*.035);
  c = mix(c, mix(vec3(.72,.82,.93), vec3(1.,.82,.66), uWarm), fog*(1.-T)*.8);
  o = vec4(c*uExpo, 1.);
}`;

const BLIT_FS = `
in vec2 vUv; out vec4 o; uniform sampler2D uTex;
void main(){ o = vec4(texture(uTex, vUv).rgb, 1.); }`;

function rotYawPitch(yaw, pitch, roll = 0) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
  // columns: right, up, back (camera looks down -Z)
  const fwd = [-sy * cp, sp, -cy * cp];
  const right0 = [cy, 0, -sy];
  const up0 = [right0[1] * fwd[2] - right0[2] * fwd[1], right0[2] * fwd[0] - right0[0] * fwd[2], right0[0] * fwd[1] - right0[1] * fwd[0]];
  const right = right0.map((v, i) => v * cr + up0[i] * sr);
  const up = up0.map((v, i) => v * cr - right0[i] * sr);
  const back = fwd.map(v => -v);
  return new Float32Array([...right, ...up, ...back]);
}

IJ.registerScene({
  name: 'sky', start: 6, end: 15, transition: { type: 'white', dur: 0.8 },
  post(l) { return { bloom: 0.35, grain: 0.03, vignette: 0.3, thresh: 0.85 }; },
  init() {
    this.noise = IJ.noise3D(64, 11);
    this.cloud = IJ.program(CLOUD_FS, null, 'clouds');
    this.blit = IJ.program(BLIT_FS, null, 'blit');
    this.title = IJ.text('INFINITE  JESS', { font: 'display', size: 200, spacing: 0.12 });
    this.sub = IJ.text('an entertainment', { font: 'serif', size: 110, italic: true });
    this.fn = IJ.text('1', { font: 'display', size: 110 });
    const s = [0.85, 0.36, -0.55]; const l = Math.hypot(...s);
    this.sun = s.map(v => v / l);
  },
  resize(W, H) {
    if (this.rt) this.rt.dispose();
    this.rt = IJ.fbo(Math.round(W * 0.5), Math.round(H * 0.5));
  },
  render(t, l) {
    const target = IJ.target;
    if (!this.rt) this.resize(IJ.W, IJ.H);
    // camera: rise up through the deck, then drift above it; at the end tilt to the sun
    const y = IJ.key(l, [[0, 1.3], [0.9, 1.78], [2.8, 2.4], [9, 2.8]], IJ.ease.sine);
    const z = -l * 0.9;
    const pitch = IJ.key(l, [[0, 0.22], [2.2, 0.06], [3.5, -0.02], [7.2, -0.03], [9, 0.16]], IJ.ease.sine);
    const yaw = IJ.key(l, [[0, -0.12], [9, 0.22]], IJ.ease.sine);
    const warm = IJ.smooth(6.6, 9, l);
    this.rt.bind();
    this.cloud.draw({
      uNoise: this.noise, uCam: [0.3 * Math.sin(l * 0.2), y, z], uRot: rotYawPitch(yaw, pitch, 0.02 * Math.sin(l * 0.5)),
      uSun: this.sun, uT: t, uExpo: 1 + 0.6 * (1 - IJ.smooth(0, 1.2, l)), uWarm: warm,
    });
    target.bind();
    this.blit.draw({ uTex: this.rt.tex });
    // title
    const a = IJ.smooth(C.titleIn - 6, C.titleIn - 6 + 1.8, l) * (1 - IJ.smooth(7.0, 8.4, l));
    if (a > 0) {
      const k = IJ.ease.out(IJ.clamp((l - (C.titleIn - 6)) / 2.4));
      const h = 0.46 * (1.07 - 0.07 * k);
      const ty = 0.38 + 0.03 * (1 - k);
      IJ.sprite(this.title, { x: 0.014, y: ty - 0.014, h, alpha: a * 0.4, color: [0.05, 0.12, 0.25], blur: 3 + 3 * (1 - k) });
      IJ.sprite(this.title, { x: 0, y: ty, h, alpha: a, color: [1, 0.99, 0.96], blur: 4 * (1 - k) });
      const a2 = IJ.smooth(3.9, 5.2, l) * (1 - IJ.smooth(7.0, 8.4, l));
      if (a2 > 0) {
        IJ.sprite(this.sub, { x: 0.008, y: 0.132, h: 0.19, alpha: a2 * 0.4, color: [0.05, 0.12, 0.25], blur: 2.5 });
        IJ.sprite(this.sub, { x: 0, y: 0.14, h: 0.19, alpha: a2, color: [1, 0.98, 0.94], blur: 1.5 * (1 - IJ.smooth(3.9, 5.2, l)) });
        // the footnote marker arrives a beat later, with a little bounce
        const fk = IJ.clamp((l - 5.1) / 0.7);
        if (fk > 0) {
          const bounce = IJ.ease.outBack(fk);
          const subW = 0.19 * this.sub.aspect, padP = 0.19 * (0.3 * 110) / this.sub.h;
          IJ.sprite(this.fn, { x: subW / 2 - padP + 0.028, y: 0.19 + 0.05 * (1 - bounce), h: 0.11, alpha: a2 * Math.min(1, fk * 2), color: [1, 0.93, 0.8] });
        }
      }
    }
  },
});
})();

<script>
// ---- js/scenes/03_portrait.js
// 15–27 s · Jess in golden-hour light, as a flat vector illustration built from signed
// distance fields. She looks over, blinks, smiles. Her freckles begin to glow, night
// falls, and the freckles lift off to become stars that join into constellations:
// Uriel, Yuffie, and an aerialist on her silks.
(function () {
const IJ = window.IJ;
const C = IJ.CUES;
const START = 15;
const NF = 36;                      // freckles
const CENTER = [0.0, 0.1];          // face origin in p-space

// ---- freckles, in face coordinates (x right, y up; face is ~0.7 wide, ~1.0 tall)
const freckles = (() => {
  const R = IJ.rng(31415), out = [];
  const add = (x, y) => out.push([x, y, 0.0042 + R() * 0.0036]);
  // across the nose bridge
  for (let i = 0; i < 10; i++) add((R() - 0.5) * 0.11, -0.04 - R() * 0.1);
  // both cheeks, densest near the nose
  for (let s of [-1, 1]) for (let i = 0; i < 13; i++) {
    const u = Math.pow(R(), 0.8);
    add(s * (0.07 + u * 0.18), -0.05 - R() * 0.1 + u * 0.03);
  }
  return out.slice(0, NF);
})();

// ---- constellations in p-space: points + edges; groups revealed on the cue pings
const CONST = (() => {
  const U = [[-1.36, 0.58], [-1.22, 0.36], [-0.95, 0.36], [-0.81, 0.58], [-0.74, 0.2], [-0.9, -0.03], [-1.08, -0.1], [-1.26, -0.03], [-1.42, 0.2], [-1.18, 0.2], [-0.99, 0.2]];
  const Y = [[0.83, 0.54], [0.94, 0.33], [1.18, 0.33], [1.29, 0.54], [1.42, 0.14], [1.24, -0.08], [1.06, -0.12], [0.88, -0.08], [0.7, 0.14], [0.97, 0.17], [1.15, 0.17]];
  const A = [[0, 5], [7.19, 11.9], [15.28, 7.19], [14.42, -0.95], [5.66, -9.61], [0, -17], [-5.66, -9.61], [-14.42, -0.95], [-15.28, 7.19], [-7.19, 11.9]]
    .map(([x, y]) => [x * 0.02, 0.46 + (y + 2.5) * 0.02]);   // a heart, sampled from the classic parametric curve
  const pts = [...U, ...Y, ...A];
  const u = 0, y = U.length, a = U.length + Y.length;
  const e = (base, list) => list.map(([i, j]) => [base + i, base + j]);
  const groups = [
    e(u, [[8, 0], [0, 1], [1, 2], [2, 3], [3, 4]]),     // Uriel's ears
    e(u, [[4, 5], [5, 6], [6, 7], [7, 8]]),             // Uriel's face
    e(y, [[8, 0], [0, 1], [1, 2], [2, 3], [3, 4]]),     // Yuffie's ears
    e(y, [[4, 5], [5, 6], [6, 7], [7, 8]]),             // Yuffie's (puffy) cheeks
    e(a, [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]]),     // heart, right half
    e(a, [[5, 6], [6, 7], [7, 8], [8, 9], [9, 0]]),     // heart, left half
  ];
  const eyes = new Set([9, 10, 20, 21]);         // bright, unlined stars
  return { pts, groups, eyes };
})();

const FS = `
in vec2 vUv; out vec4 o;
uniform float uT, uL, uAng, uScale, uSmile, uGaze, uOpen, uGlow, uNight, uFreckOn, uSway;
uniform vec3 uFreck[${NF}];
uniform vec2 uCenter;

// ---------- shapes (face coordinates)
float faceRx(float y){
  if (y > .06) { float u = (y-.06)/.45; return .31*sqrt(max(0., 1.-u*u)); }
  if (y > -.12) return mix(.3, .312, (y+.12)/.18);
  float s = clamp((-.12 - y)/.385, 0., 1.);
  return .3*sqrt(max(0., 1. - pow(s, 2.8))) * (1. - .33*s*s);
}
float faceSD(vec2 f){ if (f.y > .51 || f.y < -.505) return .05; return abs(f.x) - faceRx(f.y); }
float hairlineY(float x){ return .41 - 2.3*(x-.015)*(x-.015); }
float wav(float y, float s){ return (.03*sin(y*6.2 + uT*1.0 + s*1.3) + .012*sin(y*13. + s*2.)) * smoothstep(.0, -.75, y); }
// one long side lock; u runs across it (0 inner edge, 1 outer edge)
float lockSD(vec2 f, float s, out float u){
  float y = f.y, w = wav(y, s);
  float xo = .405 + .09*smoothstep(.02, -.6, y) - .07*smoothstep(-.78, -1.08, y) + w;
  float xi = mix(.08, .15 + .06*smoothstep(-.55, -1., y), smoothstep(-.3, -.52, y)) + w*.8;
  float x = f.x*s;
  u = (x - xi)/max(xo - xi, .01);
  float d = max(x - xo, xi - x);
  float yb = -1.03 + .075*abs(sin((x - .28)*12. + s)) + .025*sin(x*7. + uT*.8);
  d = max(d, yb - y);
  return max(d, y - .02);
}
float hairBackSD(vec2 f){
  float u, d = sdEllipse(f - vec2(0., .13), vec2(.415, .445));
  d = smin(d, lockSD(f, -1., u), .07);
  d = smin(d, lockSD(f,  1., u), .07);
  d = min(d, sdBox(f - vec2(0., -.42), vec2(.25, .24)));     // behind the neck
  return d;
}
float shouldersSD(vec2 f){ return sdEllipse(f - vec2(0., -1.19), vec2(.98, .56)); }
float neckSD(vec2 f){ return sdRBox(f - vec2(0., -.52), vec2(.102, .15), .05); }

// ---------- colors
const vec3 SKIN = vec3(.98,.82,.7), SKIN_SH = vec3(.86,.6,.52), SKIN_HI = vec3(1.,.9,.79);
const vec3 HAIR = vec3(.8,.48,.26), HAIR_SH = vec3(.43,.21,.12), HAIR_HI = vec3(1.,.8,.52);
const vec3 TOP = vec3(.7,.3,.19), TOP_SH = vec3(.45,.17,.12);
const vec3 LIGHT_DIR = vec3(-.62,.42,.66);

vec3 hairShade(vec2 f, float d){
  float s = f.x < 0. ? -1. : 1.;
  float ul; lockSD(f, s, ul);
  float ur = atan(abs(f.x - .015), .62 - f.y)*2.2;            // strands radiate from the part
  float k = smoothstep(.12, -.28, f.y);
  float u = mix(ur, ul*2.2 + .6, k);
  // soft clumps with lighter centres, gently waving
  float cu = u*2.2 + .18*sin(f.y*4. + s + uT*.6);
  float cl = fract(cu);
  float clump = smoothstep(0., .45, cl)*smoothstep(1., .55, cl);
  float lit = sat(.62 - f.x*.85 + f.y*.25);                    // sun from the upper left
  vec3 c = mix(HAIR_SH, HAIR, .28 + .5*lit + .18*clump*lit);
  float n = gnoise(vec2(u*5., f.y*1.5));
  float streak = smoothstep(.93, 1., sin(u*26. + n*2.));
  c = mix(c, HAIR_HI, streak*.3*lit);
  c *= .96 + .04*sin(u*11. + n);
  // hair behind the neck sits in shadow
  c *= mix(1., .55, (1.-smoothstep(.2, .3, abs(f.x)))*smoothstep(-.25, -.4, f.y));
  // glossy bands: one on the crown, one where the locks turn
  float b1 = exp(-pow((length((f - vec2(.015,.12))/vec2(1.,1.05)) - .36)/.035, 2.))*smoothstep(-.05,.2,f.y);
  float b2 = exp(-pow((f.y + .42 + .06*sin(u*2. + s))/.07, 2.))*k;
  c = mix(c, HAIR_HI, (b1*.55 + b2*.35)*lit*(.5 + .5*clump));
  // golden rim where the sun catches the outer edge
  c += vec3(1.,.72,.38)*smoothstep(-.03, 0., d)*smoothstep(.15, -.3, f.x)*.65;
  return c;
}

vec3 night(vec2 p){
  vec3 c = mix(vec3(.02,.025,.07), vec3(.05,.06,.16), sat(p.y*.4 + .5));
  // faint band of the galaxy
  float band = exp(-pow((p.y - p.x*.35 - .1)*2.2, 2.)) * (.5 + .5*fbm(p*2.5 + 3.));
  c += vec3(.08,.07,.14)*band;
  // small twinkling stars
  vec2 g = p*42.; vec2 id = floor(g); vec2 fr = fract(g) - .5;
  float h = hash12(id);
  if (h > .86) {
    vec2 off = (hash22(id) - .5)*.6;
    float tw = .55 + .45*sin(uT*(2. + h*5.) + h*40.);
    c += vec3(.85,.9,1.) * smoothstep(.09, 0., length(fr - off)) * tw * (h - .86)*6.;
  }
  return c;
}

void main(){
  vec2 p = (2.*gl_FragCoord.xy - uRes)/uRes.y;
  vec2 f = rot(-uAng)*(p - uCenter)/uScale;
  float aa = 1.5/uRes.y/uScale;

  // ---- background: golden hour, soft bokeh
  vec3 bg = mix(vec3(1.,.8,.52), vec3(.55,.36,.42), sat(.5 - p.x*.22 - p.y*.35));
  bg = mix(bg, vec3(1.,.93,.75), .35*exp(-length(p - vec2(-1.3,.9))*1.2));
  for (int i = 0; i < 9; i++){
    float fi = float(i);
    vec2 c = vec2(hash11(fi*3.1)*3.6 - 1.8, hash11(fi*7.3)*2.2 - 1.1) + vec2(sin(uT*.2 + fi)*.08, uT*.015);
    float r = .09 + hash11(fi*1.7)*.14;
    float b = smoothstep(r, r - .015, length(p - c));
    bg = mix(bg, bg*1.18 + vec3(.06,.04,0.), b*.5);
  }
  vec3 col = bg;

  // ---- hair (back)
  float hb = hairBackSD(f);
  col = mix(col, hairShade(f, hb), fillAA(hb, aa*2.));

  // ---- shoulders + top (rust), neck
  float sh = shouldersSD(f);
  float neckOpen = sdEllipse(f - vec2(0., -.655), vec2(.165, .08));
  float top = max(sh, -neckOpen);
  float nk = neckSD(f);
  vec3 skinNeck = mix(SKIN_SH, SKIN, .55 + .3*sat(-f.x*2.));
  skinNeck *= mix(1., .72, smoothstep(-.53, -.43, f.y));     // shadow under the chin
  skinNeck *= 1. - .12*smoothstep(.04, .1, abs(f.x));
  col = mix(col, skinNeck, fillAA(min(nk, max(sh, neckOpen - .0)), aa*2.));
  vec3 topC = mix(TOP_SH, TOP, sat(.6 - f.x*.6 + (f.y + 1.)*.4));
  topC += .05*sin(f.x*40. + sin(f.y*9.)*2.)*smoothstep(-.8,-1.1,f.y);  // a few soft folds
  col = mix(col, topC, fillAA(top, aa*2.));

  // ---- face
  float fd = faceSD(f);
  vec3 n = normalize(vec3(f.x/.34, (f.y + .02)/.62, 1.));
  float diff = sat(dot(n, normalize(LIGHT_DIR)));
  vec3 skin = mix(SKIN_SH, SKIN, smoothstep(.25, .9, diff));
  skin = mix(skin, SKIN_HI, smoothstep(.85, 1., diff)*.6);
  // a patch of light drifting across, like sun through a car window
  float lpatch = smoothstep(.2, .8, sin(f.x*2.2 + f.y*1.6 - uT*.6)*.5 + .5);
  skin *= .97 + .05*lpatch;
  // blush
  for (int s = -1; s <= 1; s += 2) skin = mix(skin, vec3(.97,.6,.56), .28*exp(-pow(length((f - vec2(float(s)*.18, -.13))/vec2(.09,.055)), 2.)));
  // nose: shadow on the right of the bridge, soft tip, nostrils
  skin *= 1. - .14*exp(-pow((f.x - .035)/.012, 2.))*smoothstep(.04, -.02, f.y)*smoothstep(-.17, -.1, f.y);
  skin *= 1. - .08*exp(-pow(length((f - vec2(.01, -.182))/vec2(.05, .014)), 2.));
  skin = mix(skin, SKIN_HI, .4*exp(-pow(length((f - vec2(-.012, -.145))/vec2(.018, .018)), 2.)));
  {
    float nd = sdBezier(f, vec2(-.03, -.165), vec2(-.004, -.19), vec2(.034, -.162)) - .0022;
    skin = mix(skin, SKIN_SH*.82, fillAA(nd, aa)*.6);
    float nb = sdBezier(f, vec2(.022, -.02), vec2(.03, -.1), vec2(.036, -.15)) - .0016;
    skin = mix(skin, SKIN_SH*.9, fillAA(nb, aa)*.25);
  }
  // eye sockets
  for (int s = -1; s <= 1; s += 2) skin *= 1. - .06*exp(-pow(length((f - vec2(float(s)*.135, .06))/vec2(.09, .04)), 2.));
  // chin + jaw shading
  skin *= 1. - .1*smoothstep(-.35, -.5, f.y);

  // freckles
  float fa = 0.; float fg = 0.;
  for (int i = 0; i < ${NF}; i++){
    vec3 q = uFreck[i];
    float d = length(f - q.xy);
    float tw = .5 + .5*sin(uT*6. + float(i)*2.4);
    fa = max(fa, smoothstep(q.z, q.z*.35, d));
    fg += exp(-d*d/(q.z*q.z*9.))*(.6 + .4*tw);
  }
  skin = mix(skin, vec3(.72,.42,.3), fa*.55*uFreckOn);

  // brows
  for (int s = -1; s <= 1; s += 2){
    vec2 b = vec2(f.x*float(s), f.y);
    float xb = clamp((b.x - .065)/.16, 0., 1.);
    float yb = .122 + .026*sin(xb*2.6) - .01*xb;
    float th = mix(.013, .0045, xb);
    float bd = abs(b.y - yb) - th;
    bd = max(bd, max(.06 - b.x, b.x - .235));
    skin = mix(skin, vec3(.55,.33,.21), fillAA(bd, aa*1.5)*.85);
  }

  // eyes
  for (int s = -1; s <= 1; s += 2){
    vec2 e = f - vec2(float(s)*.135, .035);
    vec2 m = vec2(e.x*float(s), e.y);            // mirrored: +x is the outer corner
    float w = .067;
    float xn = clamp(m.x/w, -1., 1.);
    float inX = step(abs(m.x), w);
    float yu = mix(-.004, .035*(1. - xn*xn)*(1. + .18*xn) + .002, uOpen);
    float yl = -.02*(1. - xn*xn)*(.8 + .2*uOpen) - .002*uOpen;
    float eyeIn = inX * smoothstep(yl - aa, yl + aa, m.y) * smoothstep(yu + aa, yu - aa, m.y);
    vec3 ec = vec3(.96,.93,.9) * (1. - .25*smoothstep(yu - .02, yu, m.y));
    vec2 ic = vec2(uGaze, -.002);
    float ir = length(e - ic);
    float ang = atan(e.y - ic.y, e.x - ic.x);
    vec3 iris = mix(vec3(.42,.66,.64), vec3(.16,.32,.35), smoothstep(.008, .026, ir));
    iris *= .85 + .15*sin(ang*22. + ir*300.);
    iris = mix(iris, vec3(.03,.04,.05), smoothstep(.0115, .009, ir));
    ec = mix(ec, iris, smoothstep(.027, .025, ir));
    ec += smoothstep(.006, .003, length(e - ic - vec2(-.008, .009)))*.9;
    ec *= 1. - .35*smoothstep(yu - .015, yu, m.y);   // shadow of the upper lid
    skin = mix(skin, ec, eyeIn);
    // lash line: thicker toward the outer corner, with a small flick
    float lt = mix(.0028, .0065, sat(xn*.5 + .5));
    float ld = abs(m.y - yu) - lt;
    ld = max(ld, abs(m.x) - w*1.04);
    float flick = sdSeg(m, vec2(w*.95, yu + .002), vec2(w*1.2, yu + .014)) - .0025;
    ld = min(ld, mix(1., flick, uOpen));
    skin = mix(skin, vec3(.26,.15,.12), fillAA(ld, aa));
    // crease and lower lid
    float cr = abs(m.y - (yu*.9 + .02 + .006*uOpen)) - .0018;
    cr = max(cr, abs(m.x) - w*.85);
    skin = mix(skin, SKIN_SH*.92, fillAA(cr, aa)*.45*uOpen);
    float lo = max(abs(m.y - yl + .003) - .0015, abs(m.x) - w*.8);
    skin = mix(skin, SKIN_SH, fillAA(lo, aa)*.3);
  }

  // mouth: a soft closed smile
  {
    float mw = .08 + .01*uSmile;
    float xn = clamp(f.x/mw, -1., 1.);
    float ym = -.285 + uSmile*.02*xn*xn - .004*(1. - xn*xn);
    float up = .02*(1. - xn*xn) - .005*exp(-pow(f.x/.012, 2.));   // cupid's bow dip
    float lo = .029*(1. - pow(abs(xn), 1.7));
    float inX = step(abs(f.x), mw);
    float ul = inX*smoothstep(ym - aa, ym + aa, f.y)*smoothstep(ym + up + aa, ym + up - aa, f.y);
    float ll = inX*smoothstep(ym + aa, ym - aa, f.y)*smoothstep(ym - lo - aa, ym - lo + aa, f.y);
    skin = mix(skin, vec3(.82,.48,.46), ul*.9);
    vec3 lc = mix(vec3(.86,.54,.5), vec3(.97,.72,.66), exp(-pow(length((f - vec2(-.015, ym - lo*.45))/vec2(.03,.007)), 2.)));
    skin = mix(skin, lc, ll*.9);
    float line = abs(f.y - ym) - mix(.0028, .0012, abs(xn));
    line = max(line, abs(f.x) - mw*1.02);
    skin = mix(skin, vec3(.5,.25,.24), fillAA(line, aa));
    // smile creases at the corners
    for (int s = -1; s <= 1; s += 2){
      float cd = sdSeg(f, vec2(float(s)*mw*1.02, ym + .004), vec2(float(s)*(mw + .016), ym + .018*uSmile + .002)) - .0015;
      skin = mix(skin, SKIN_SH, fillAA(cd, aa)*.5*uSmile);
    }
  }

  // warm rim on the lit edge of the face
  skin += vec3(1.,.7,.4)*smoothstep(-.03, 0., fd)*step(f.x, 0.)*.25;
  float faceMask = fillAA(fd, aa*2.);
  col = mix(col, skin, faceMask);

  // ---- hair (front): the part, curtains framing the face, locks over the shoulders
  float hl = f.y - hairlineY(f.x);
  float cw = mix(.015, .085, smoothstep(-.28, .28, f.y));
  float curtain = abs(f.x) - (faceRx(f.y) - cw);
  float onFace = max(1. - smoothstep(-aa*2., aa*2., -hl), (1. - smoothstep(-aa*2., aa*2., -curtain))*smoothstep(-.3, -.22, f.y));
  float uu;
  float locks = max(max(min(lockSD(f, -1., uu), lockSD(f, 1., uu)), f.y + .3), -fd);
  float frontMask = max(faceMask*onFace, fillAA(locks, aa*2.));
  col = mix(col, hairShade(f, min(hb, locks)), frontMask);
  // shadow the hair casts on the face, and the part
  col *= 1. - .22*faceMask*(1. - frontMask)*smoothstep(.035, 0., min(-hl, -curtain + .0));
  col = mix(col, HAIR_SH, fillAA(sdSeg(f, vec2(.015, .4), vec2(.018, .58)) - .004, aa)*.55*step(hb, 0.));

  // ---- glowing freckles, then night
  vec3 day = col;
  vec3 glowC = vec3(1.,.83,.5);
  day += glowC*fg*.35*uGlow*faceMask + glowC*fa*uGlow*faceMask*.8;
  vec3 nightC = night(p);
  float sil = max(max(fillAA(hb, aa*2.), fillAA(top, aa*2.)), max(faceMask, fillAA(nk, aa*2.)));
  vec3 silC = vec3(.015,.018,.04) + vec3(.1,.12,.25)*smoothstep(-.03, 0., max(hb, fd))*.4;
  nightC = mix(nightC, silC, sil*smoothstep(1., .55, uNight*1.1));
  col = mix(day, nightC, uNight);
  o = vec4(col, 1.);
}`;

IJ.registerScene({
  name: 'portrait', start: START, end: 27, transition: { type: 'fade', dur: 1.6 },
  post(l) { return { bloom: IJ.lerp(0.25, 0.9, IJ.smooth(6, 8, l)), grain: 0.03, vignette: 0.4, thresh: IJ.lerp(0.8, 0.35, IJ.smooth(6, 8, l)) }; },
  init() {
    this.p = IJ.program(FS, null, 'portrait');
    this.freckData = new Float32Array(NF * 3);
    freckles.forEach((q, i) => this.freckData.set(q, i * 3));
    this.points = IJ.Points(200);
    this.lines = IJ.Lines(200);
    // each freckle is assigned a destination: constellation points first, then free stars
    const R = IJ.rng(99);
    this.dest = freckles.map((q, i) => i < CONST.pts.length ? CONST.pts[i] : [(R() - 0.5) * 3.2, 0.5 + R() * 0.45]);
    // shuffle the assignment so the lift looks like a scatter, not an ordered sweep
    this.order = freckles.map((_, i) => i).sort(() => R() - 0.5);
  },
  pose(l) {
    return {
      ang: -0.05 + 0.03 * Math.sin(l * 0.7),
      scale: 1 + 0.004 * Math.sin(l * 1.9) + 0.012 * IJ.smooth(0, 6, l),
    };
  },
  facePoint(q, pose) {
    const c = Math.cos(pose.ang), s = Math.sin(pose.ang);
    const x = q[0] * pose.scale, y = q[1] * pose.scale;
    return [CENTER[0] + c * x - s * y, CENTER[1] + s * x + c * y];
  },
  render(t, l) {
    const pose = this.pose(l);
    const blink = (at) => { const k = (l - at) / 0.16; return k > 0 && k < 1 ? Math.sin(k * Math.PI) : 0; };
    const open = 1 - Math.max(blink(1.5), blink(4.0), blink(5.6));
    const smile = IJ.key(l, [[0, 0.15], [2.5, 0.2], [3.3, 1]], IJ.ease.sine);
    const gaze = IJ.key(l, [[0, -0.02], [2.0, -0.02], [2.5, 0.001]], IJ.ease.inOut);
    const liftAt = C.freckleLift - START;
    const glow = IJ.smooth(C.freckleGlow - START, C.freckleGlow - START + 1.2, l);
    const nightK = IJ.smooth(liftAt - 0.2, liftAt + 1.5, l);
    this.p.draw({
      uT: t, uL: l, uAng: pose.ang, uScale: pose.scale, uSmile: smile, uGaze: gaze, uOpen: open,
      uGlow: glow, uNight: nightK, uFreckOn: l < liftAt ? 1 : 0, uFreck: this.freckData, uCenter: CENTER,
    });

    // ---- freckles as particles once they lift
    if (l < liftAt) return;
    const P = this.points, Ls = this.lines;
    P.clear(); Ls.clear();
    const liftPose = this.pose(liftAt);
    const pos = [];
    freckles.forEach((q, i) => {
      const k = this.order.indexOf(i);
      const u = IJ.clamp((l - liftAt - k * 0.025) / 1.35);
      const e = IJ.ease.inOut(u);
      const a = this.facePoint(q, liftPose), b = this.dest[i];
      // arc outward and upward
      const mx = (a[0] + b[0]) / 2 + (b[0] - a[0]) * 0.15, my = Math.max(a[1], b[1]) + 0.35;
      const x = (1 - e) * (1 - e) * a[0] + 2 * (1 - e) * e * mx + e * e * b[0];
      const y = (1 - e) * (1 - e) * a[1] + 2 * (1 - e) * e * my + e * e * b[1];
      pos.push([x, y]);
      const isEye = CONST.eyes.has(i);
      const tw = 0.8 + 0.2 * Math.sin(t * 4 + i * 1.7);
      const size = (isEye ? 0.011 : 0.0075) * (0.8 + 0.4 * e) * tw;
      const col = [IJ.lerp(1, 0.85, e), IJ.lerp(0.83, 0.9, e), IJ.lerp(0.5, 1, e)];
      P.add(x, y, 0, size, col[0], col[1], col[2], 1, 0.9 + (isEye ? 0.8 : 0), isEye ? 0.8 : 0.35 * e);
    });
    // ---- constellation lines, one group per ping, each edge drawn on over 0.45 s
    CONST.groups.forEach((g, gi) => {
      const at = C.constellations[gi] - START;
      g.forEach(([i, j], ei) => {
        const u = IJ.ease.out(IJ.clamp((l - at - ei * 0.06) / 0.45));
        if (u <= 0) return;
        const a = pos[i], b = pos[j];
        const pulse = 1 + 0.6 * Math.exp(-(l - at) * 3);
        Ls.add2(a[0], a[1], a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, [0.75 * pulse, 0.82 * pulse, 1, 0.55], 0.0022, 1.2);
      });
    });
    // the last chime: a shooting star
    const ss = C.constellations[6] - START;
    const su = (l - ss) / 0.9;
    if (su > 0 && su < 1) {
      const e = IJ.ease.out(su), fade = Math.sin(su * Math.PI);
      const x0 = -1.7 + 1.5 * e, y0 = 0.98 - 0.2 * e;
      Ls.add2(x0 - 0.35, y0 + 0.06, x0, y0, [1, 0.95, 0.85, 0.7 * fade], 0.003, 2);
      P.add(x0, y0, 0, 0.008, 1, 0.95, 0.85, fade, 1.2, 0.6);
    }
    Ls.draw();
    P.draw();
  },
});
})();
